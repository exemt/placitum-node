# Проверки на каждую выкладку в develop и на pull request.
#
# Модуль здесь не собирается: для этого нужны исходники nginx нужной версии,
# и это делает сборка образа (managed/Dockerfile). CI держит агента и
# юнит-конфиги модуля.

name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: test -race
        run: go test -race ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Сборка образа узла целиком: модуль против исходников nginx, агент,
      # страницы. Она же прогоняет тесты агента внутри.
      - name: build image
        run: docker build -f managed/Dockerfile -t placitum/node:ci .
