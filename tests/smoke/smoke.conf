# Дымовой прогон модуля без шины: живой запрос проходит контекст целиком --
# создание ctx, локальный слой, снимок, вердикт, диагностический заголовок,
# строка лога, датаграмма агенту.
#
# Инспекторов здесь нет намеренно: NATS и Redis в дымовой прогон не тянем, а
# всё, что ломается при перестановке полей контекста, ломается и без них.
# Полный контур -- tests/e2e и nginx/tests/load.
#
# Маршруты отдают файл, а не "return 204": return исполняется на фазе rewrite,
# то есть до ACCESS, и обработчик модуля на таком маршруте не вызывается ни
# разу. Для nginx -t это неважно, для живого запроса -- решает всё.

load_module modules/ngx_http_waf_module.so;

events { }

error_log /dev/stdout info;

http {
    access_log off;

    waf_node_id       smoke;
    waf_agent_socket /tmp/waf-agent.sock;   # слушателя нет: промах не двигает запрос

    waf_shm_zone waf 1m;

    waf_local_dataset badua type=string limit=16 internal;
    waf_local_dataset badua sqlmap/1.0;

    waf_deny_response blocked status=403;

    waf_var node $hostname;

    server {
        listen 8080;

        waf on;
        waf_debug_header on;

        root /usr/share/nginx/html;

        waf_capture request headers=8k args=8k;
        waf_capture request headers mask=cookie;
        waf_preview request headers=1k/256 args=512;

        waf_inspect  request none;
        waf_deadline request 50ms;
        waf_exception request timeout deny;

        location / {
            waf_local_check badua $http_user_agent action=block
                            response=blocked;
        }

        # Ни снимка, ни волн: маршрут обязан остаться рабочим и не класть
        # в обменник ничего.
        location /static/ {
            alias /usr/share/nginx/html/;

            waf_capture request none;
            waf_preview request none;
            waf_inspect request none;
        }

        # allow локального слоя выше block: тот же UA проходит мимо всего.
        location /allowlisted/ {
            alias /usr/share/nginx/html/;

            waf_local_check badua $http_user_agent action=allow;
        }
    }
}
