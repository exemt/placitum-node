#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/select-ok.conf
#
# Селекторы запроса и условия if: разбор всех форм, которые описаны в
# docs/directives/list/select.md. Шины здесь нет намеренно -- условие считается
# по локальным наборам и от неё не зависит.

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_shm_zone      waf 32m;
    # пакеты и снапшоты активных наборов -- внутренний Redis (docs/keeper.md)
    waf_sets_store driver=redis url=redis://127.0.0.1:6380;

    waf_deny_response blocked    status=403;
    waf_deny_response suspicious status=403;
    waf_deny_response too_many   status=429;

    waf_bus   nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;
    waf_inspector sqli   subject=waf.req.sqli;
    waf_inspector modsec subject=waf.req.modsec;

    waf_local_dataset blocklist type=cidr   limit=100000 ttl=5m active;
    waf_local_dataset badua     type=string limit=65536 active;
    waf_local_dataset badsid    type=string limit=10000 active;
    waf_local_dataset badargs   type=string limit=10000 active;
    waf_local_dataset trusted   type=string limit=10000 active;
    waf_local_dataset greyua    type=string limit=10000 active;

    server {
        listen 8080;

        waf on;

        # значение по имени: заголовок, кука, аргумент
        waf_local_check badua   $waf_request_headers.user-agent action=block
                        response=suspicious;
        waf_local_check badsid  $waf_request_cookies.sid        action=block
                        response=blocked;
        waf_local_check badargs $waf_request_args.q             action=block
                        response=blocked;

        # всё множество значений объекта
        waf_local_check badargs $waf_request_args.*             action=block
                        response=blocked;

        # if на проверке: доверенную сессию бан не трогает
        waf_local_check blocklist $binary_remote_addr action=block
                        response=blocked
                        if $waf_request_cookies.sid not in trusted;

        # if на лимите частоты; ключ -- одно значение, не множество
        waf_local_rate $waf_request_cookies.sid rate=5r/s burst=5
                       response=too_many
                       if $waf_request_cookies.sid not in trusted;

        # if на вызове инспектора, в том числе два условия -- И
        waf_inspect request sqli   wave=0 timeout=15ms
                    if $waf_request_cookies.sid not in trusted;
        waf_inspect request modsec wave=1 timeout=1s
                    if $waf_request_headers.user-agent in greyua
                    if $waf_request_cookies.sid not in trusted;

        location / {
            return 204;
        }

        # обычные переменные nginx работают там же, где селекторы
        location /plain/ {
            waf_local_check badua $http_user_agent action=block
                            if $binary_remote_addr not in blocklist;
            return 204;
        }
    }
}
