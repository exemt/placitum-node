#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/local-none.conf
#
# Снятие локального слоя на пути. Наследование здесь замена, и отсутствие
# строки означает не «правил нет», а «правила сверху»: сказать «здесь не
# проверяем» можно только словом none, и оно видно в конфиге.
#
# Зоны для none не требуется -- правил нет, в разделяемую память никто не
# ходит, -- но здесь она есть ради правил сервера.

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_shm_zone      waf 16m;
    # пакеты и снапшоты активных наборов -- внутренний Redis (docs/keeper.md)
    waf_sets_store driver=redis url=redis://127.0.0.1:6380;

    waf_deny_response blocked  status=403;
    waf_deny_response too_many status=429;

    waf_local_dataset blocklist type=cidr limit=100000 ttl=5m active;

    server {
        listen 8080;
        waf on;

        waf_local_check blocklist $binary_remote_addr action=block response=blocked;
        waf_local_rate  $binary_remote_addr rate=5r/s burst=5 response=too_many;

        location / {
            return 204;
        }

        # Ни проверок, ни лимитов: серверные сняты обеими строками.
        location /health {
            waf_local_check none;
            waf_local_rate  none;
            return 204;
        }

        # Сняты только проверки: лимит сервера продолжает действовать, потому
        # что своей строки waf_local_rate здесь нет.
        location /open/ {
            waf_local_check none;
            return 204;
        }
    }
}
