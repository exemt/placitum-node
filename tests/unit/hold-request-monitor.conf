# Фаза запроса всегда gate: отпущенный запрос -- это не наблюдение, а
# отсутствие фазы. Наблюдение без гейта называется mode=passive.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf_hold: the request phase is always gate; for watching
#                    without gating write mode=passive on waf_inspect

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_inspector ip        subject=waf.req.ip;
    waf_inspector ws_rules  subject=waf.frm.rules;
    waf_inspector dlp       subject=waf.rsp.dlp;

    server {
        listen 8080;
        waf on;
        waf_hold request monitor;

        location / {
            return 204;
        }
    }
}
