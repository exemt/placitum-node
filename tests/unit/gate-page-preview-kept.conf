# Страница проверки с превью, не снятым с уровня сервера, и без снимка. Без
# инспекторов превью берётся из самого запроса, а не из снимка, которого нет:
# nginx -t проходит, запись страницы несёт заголовки со списками превью.

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;
    waf_shm_zone waf 8m;

    waf_deny_response too_many status=429;

    waf_inspector captcha subject=waf.req.captcha;

    server {
        listen 8080;
        waf on;

        waf_inspect request captcha wave=0 timeout=20ms;
        waf_capture request headers args body;
        waf_preview request headers=16k/2k;

        location ^~ /waf/captcha {
            waf_inspect request none;
            waf_capture request none;

            waf_local_rate $binary_remote_addr rate=10r/s burst=10
                           response=too_many;

            return 204;
        }

        location / {
            return 204;
        }
    }
}
