# Управляющие глаголы: mode=off -- спящая строка, её поднимает active или
# passive от любого инспектора, спрошенного на этом маршруте. Отдельного
# разрешения у адресата нет: control= снят. На кадрах -- обе стороны одной
# строкой.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/inspect-mode-off-ok.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s;

    waf_inspector counter subject=waf.req.counter;
    waf_inspector rewrite subject=waf.req.rewrite;
    waf_inspector modsec  subject=waf.req.modsec;

    server {
        listen 8080;
        waf on;

        location /api/ {
            waf_inspect request counter wave=0;
            waf_inspect request rewrite wave=1 mode=off;
            waf_inspect request modsec  wave=1;
            return 204;
        }

        location /ws/ {
            waf_inspect frame counter wave=0;
            waf_inspect frame rewrite wave=1 mode=off;
            waf_inspect frame:c2s modsec wave=0 mode=passive;
            waf_capture frame body=16k;
            return 204;
        }
    }
}
