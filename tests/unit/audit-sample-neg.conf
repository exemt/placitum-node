# Отрицательный сэмпл не грузится: "минус пять процентов трафика" не значит
# ничего, а молчаливое приведение к нулю выключило бы журнал незаметно.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: invalid waf_audit_sample "-5", expected a percentage 0..100

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_audit_sample -5;

    server {
        listen 8080;
        waf on;

        location / {
            return 204;
        }
    }
}
