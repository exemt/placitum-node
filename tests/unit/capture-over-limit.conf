# Размер захвата больше, чем WAF вообще читает, -- ошибка конфигурации.
# Потолок -- меньшее из waf_body_limit и client_max_body_size; сверяется
# любой названный объект, не только тело.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/capture-over-limit.conf
#
#     nginx: [emerg] waf: waf_capture body 10240 exceeds the 1024 bytes this
#            object the WAF reads at all; lower it or raise waf_body_limit /
#            client_max_body_size

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ip subject=waf.req.ip;
    server {
        listen 8080;

        waf on;
        waf_inspect request ip wave=0;

        location / {
            waf_body_limit request 1k;
            waf_capture request body=10k;
            return 204;
        }
    }
}
