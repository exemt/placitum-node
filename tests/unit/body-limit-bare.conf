# waf_body_limit без фазы: чьё тело ограничено -- у ответа и у кадра свои
# пределы, и молчаливый request однажды ограничил бы не то.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: write request, response, frame, frame:c2s or
#                    frame:s2c as the first word; "1m" is not a phase

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_inspector ip        subject=waf.req.ip;
    waf_inspector ws_rules  subject=waf.frm.rules;
    waf_inspector dlp       subject=waf.rsp.dlp;

    server {
        listen 8080;
        waf on;
        waf_body_limit 1m block;

        location / {
            return 204;
        }
    }
}
