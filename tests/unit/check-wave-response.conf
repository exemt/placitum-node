# response= только у block. У wave задать -- ошибка.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: response= is only valid with action=block

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_shm_zone      waf 1m;
    waf_deny_response blocked status=403;

    waf_local_dataset tokens type=string limit=10000 active;

    server {
        listen 8080;
        waf on;
        waf_local_check tokens $http_x_api_key action=wave response=blocked;
        location / { return 204; }
    }
}
