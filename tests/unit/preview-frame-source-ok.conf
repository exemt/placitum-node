# source=sent: в записи показать доставленную версию подменённого кадра,
# оригинал остаётся в архиве. Ось только у body фаз с подменой.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/preview-frame-source-ok.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ws_rw subject=waf.frm.rw;

    server {
        listen 8080;
        waf on;

        location /ws/ {
            waf_capture  frame body=8k;
            waf_inspect  frame ws_rw wave=0 timeout=5ms;
            waf_body_limit frame 64k block;

            waf_archive  frame body ttl=1h;              # оригинал в архив
            waf_preview  frame body=16k source=sent;     # доставленное в запись
            return 204;
        }
    }
}
