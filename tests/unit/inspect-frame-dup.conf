# waf_inspect frame настраивает оба направления, поэтому строка frame:s2c
# следом -- повтор имени на той же фазе.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: inspector "ws_rules" is already bound on this route
#                    for the same phase

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_inspector ip        subject=waf.req.ip;
    waf_inspector ws_rules  subject=waf.frm.rules;
    waf_inspector dlp       subject=waf.rsp.dlp;

    server {
        listen 8080;
        waf on;

        location /ws/ {
            waf_inspect frame     ws_rules wave=0;
            waf_inspect frame:s2c ws_rules wave=0;
            return 204;
        }
    }
}
