# Проверка без значения -- не «проверка по умолчанию», а недописанная строка:
# сравнивать набор не с чем.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: waf_local_check expects <dataset> <value> or "none"

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_shm_zone      waf 1m;

    waf_local_dataset blocklist type=cidr limit=1000 active;

    server {
        listen 8080;
        waf on;

        location / {
            waf_local_check blocklist;
            return 204;
        }
    }
}
