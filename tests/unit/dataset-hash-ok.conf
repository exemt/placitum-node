# hash=md5: набор строк хранит md5 значений, ключ корзины -- md5 ключа.
#
# Набор с hash=md5 хешируют все, кто с ним сравнивается или в него пишет:
# check, if, автобан rate. hash=md5 у самого rate -- про ключ корзины, и оба
# флага независимы: корзина по хешу, в набор -- сырой ключ, а хешировать ли его
# там, решает набор.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/dataset-hash-ok.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_shm_zone      waf 32m;
    # пакеты и снапшоты активных наборов -- внутренний Redis (docs/keeper.md)
    waf_sets_store driver=redis url=redis://127.0.0.1:6380;

    waf_deny_response blocked  status=403;
    waf_deny_response too_many status=429;

    # порядок опций свободный: hash= до type= и после
    waf_local_dataset sessions type=string limit=100000 ttl=1h hash=md5 active;
    waf_local_dataset tokens   hash=md5 type=string limit=10000 active;
    waf_local_dataset badua    type=string limit=65536 active;

    server {
        listen 8080;
        waf on;

        waf_local_check sessions $cookie_session action=block response=blocked;
        waf_local_check tokens   $waf_request_headers.x-api-key action=wave;
        waf_local_check badua    $http_user_agent action=block
                        if $cookie_session not in sessions;

        # корзина по md5 куки, автобан в хешированный набор
        waf_local_rate $cookie_session rate=10r/s burst=20 hash=md5
                       response=too_many list=sessions;

        # корзина по md5, набор без хеша: сырой ключ уезжает как есть
        waf_local_rate $http_authorization rate=10r/m burst=0 hash=md5
                       response=too_many list=badua ttl=5m;

        # корзина по сырому ключу, набор хеширует сам
        waf_local_rate $arg_token rate=1r/s burst=5
                       response=too_many list=tokens ttl=5m;

        location / {
            return 204;
        }
    }
}
