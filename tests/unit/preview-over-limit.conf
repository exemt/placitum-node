# Превью больше, чем WAF вообще читает, -- ошибка конфигурации. Бюджет
# маршрута стоит последним: выше него абсолютные пределы чтения
# (client_max_body_size, waf_body_limit, large_client_header_buffers), и байт за
# ними не существует ни при каком бюджете. Принятое молча значение выглядело бы
# настроенным, а колонка в ClickHouse оказалась бы обрезанной по чужому числу.
#
# Ошибка только на числе, названном здесь же. Унаследованное сверху превью
# маршрут, опустивший waf_body_limit, молча урежет: он не переписывал превью и не
# обязан повторять его ради своего предела.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/preview-over-limit.conf
#
#     nginx: [emerg] waf: waf_preview body 10240 is over the 1024 bytes of this
#            object the WAF reads at all; lower it or raise the read limit

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ip subject=waf.req.ip;
    server {
        listen 8080;

        waf on;
        waf_inspect request ip wave=0;

        location / {
            waf_body_limit request 1k;
            waf_preview request body=10k;
            return 204;
        }
    }
}
