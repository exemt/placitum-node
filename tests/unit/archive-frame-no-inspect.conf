# Архив кадров стороны, которую никто не спрашивает: держать нагрузку и
# решать исход некому, как у ответа без waf_inspect response.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: waf_archive frame needs inspectors on the route

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ws_rules subject=waf.frm.rules;

    server {
        listen 8080;
        waf on;

        location /ws/ {
            waf_capture  frame body=64k;
            waf_inspect  frame:c2s ws_rules wave=0 timeout=5ms;
            waf_archive  frame body ttl=1h;
            return 204;
        }
    }
}
