# weight= снят: очки ложатся в сумму как присланы (0..100), рычаг оператора
# -- порог waf_score_deny, а инспектору, который должен считать, а не решать,
# -- mode=vote. Опция на вызове -- ошибка с подсказкой, а не "unknown option".
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: weight= is gone; the score counts as sent (0..100),
#                    tune waf_score_deny instead, and for an inspector that
#                    only counts write mode=vote

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s;

    waf_inspector modsec subject=waf.req.modsec;

    server {
        listen 8080;
        waf on;

        location /api/ {
            waf_inspect request modsec wave=0 weight=0.5;
            return 204;
        }
    }
}
