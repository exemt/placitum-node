# Кеш вердикта -- только кадры: у запроса и ответа вердикт зависит от
# заголовков и адреса, которых в ключе нет.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/frame-cache-request.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s;
    waf_shm_zone waf 1m;

    waf_inspector rules subject=waf.req.rules;

    server {
        listen 8080;
        waf on;

        location / {
            waf_frame_cache request ttl=10s;
            waf_inspect request rules wave=0 timeout=5ms;
            return 204;
        }
    }
}
