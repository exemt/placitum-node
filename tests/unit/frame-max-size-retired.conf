# Потолок кадра -- waf_body_limit своей фазы, вместе с политикой на
# превышение.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: "waf_frame_max_size" no longer exists;
#                    use "waf_body_limit frame 64k block" instead

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_inspector ip       subject=waf.req.ip;
    waf_inspector ws_rules subject=waf.frm.rules;

    server {
        listen 8080;
        waf on;

        location /ws/ {
            waf_frame_max_size 64k;
            return 204;
        }
    }
}
