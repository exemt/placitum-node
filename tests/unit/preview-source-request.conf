# source=sent у превью тела фазы запроса: тело запроса тоже подменяют
# (waf_send request body=store поднимает версию инспектора апстриму), и запись
# вправе показать доставленное вместо оригинала.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/preview-source-request.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s;

    waf_inspector rewrite subject=waf.req.rewrite;

    server {
        listen 8080;
        waf on;
        location /api/ {
            waf_capture request body;
            waf_inspect request rewrite wave=0 timeout=5ms;
            waf_send request body=store;
            waf_preview request body=8k source=sent;
            return 204;
        }
    }
}
