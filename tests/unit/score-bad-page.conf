# response= -- страница каталога, не фаза. Нет в каталоге -- nginx -t.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: waf_deny_response "неттакой" is not declared

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_deny_response blocked status=403;

    server {
        listen 8080;
        waf on;
        waf_score_deny request 100 response=неттакой;

        location / {
            return 204;
        }
    }
}
