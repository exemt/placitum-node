# Предел на одно действие короче кода повода: канал, по которому не проходит ни
# одно осмысленное действие. Молчать нельзя -- маршрут выглядел бы работающим.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf_action_max must be at least 64: shorter than a
#            reason code

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_action_max 32;

    server {
        listen 8080;
        waf on;

        location / {
            return 204;
        }
    }
}
