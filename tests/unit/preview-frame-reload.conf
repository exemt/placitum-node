# reload у кадра невозможен и для превью: оригинала нет.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf_preview reload: a frame has no original to reload from

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s;

    waf_inspector ws_rules subject=waf.frm.rules;

    server {
        listen 8080;
        waf on;

        location /ws/ {
            waf_capture  frame:c2s body=64k;
            waf_inspect  frame:c2s ws_rules wave=0 timeout=5ms;
            waf_preview  frame:c2s reload body=capture;
            return 204;
        }
    }
}
