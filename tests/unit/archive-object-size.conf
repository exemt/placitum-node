# Размер пишется на объекте, when= только allow|deny, без when -- любой исход.
# Без "=" -- весь объект, =none -- этот вид выкл. Общий limit= снят.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/archive-object-size.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id unit;

    waf_bus nats://127.0.0.1:4222;
    waf_agent_socket /tmp/waf.sock;
    waf_deny_response blocked status=403;

    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ip subject=waf.req.ip;
    server {
        listen 8080;

        waf on;
        waf_inspect request ip wave=0;
        waf_capture request headers args body;

        location / {
            waf_archive request headers=64k args=64k ttl=30d when=deny;
            return 204;
        }

        location /whole/ {
            waf_archive request headers args body ttl=1h;
            return 204;
        }

        location /off/ {
            waf_archive request headers=none args=64k body ttl=1h when=allow;
            return 204;
        }
    }
}
