# hash= у waf_local_rate принимает только md5, как и набор: ключ корзины и
# значение в наборе считаются одной функцией.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/local-rate-hash-bad.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_shm_zone      waf 1m;

    waf_deny_response too_many status=429;

    server {
        listen 8080;
        waf on;

        waf_local_rate $cookie_session rate=10r/s burst=20 hash=crc32
                       response=too_many;

        location / {
            return 204;
        }
    }
}
