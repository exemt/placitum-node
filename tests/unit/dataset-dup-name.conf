# Повтор имени слота -- ошибка.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: dataset "office" is already declared

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_shm_zone      waf 1m;

    waf_local_dataset office type=cidr limit=1024 internal;
    waf_local_dataset office type=cidr limit=2048 active;

    server {
        listen 8080;
        waf on;
        location / { return 204; }
    }
}
