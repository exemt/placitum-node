# control= снят: управляющие глаголы принимает любой вызов от любого
# спрошенного соседа, называть отправителей больше негде. Старая опция --
# это конфигурация, собранная контроллером прежней версии, и молча съесть
# её нельзя: оператор ждёт от неё гранта, которого больше нет.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/inspect-control-gone.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s;

    waf_inspector counter subject=waf.req.counter;
    waf_inspector rewrite subject=waf.req.rewrite;

    server {
        listen 8080;
        waf on;

        location /api/ {
            waf_inspect request counter wave=0;
            waf_inspect request rewrite wave=1 mode=off control=counter;
            return 204;
        }
    }
}
