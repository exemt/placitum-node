# allow= и deny= -- отдельные строки, есть и у args. Запрет сильнее
# разрешения. Нет своей строки -- списки capture.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/preview-allow-deny.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ip subject=waf.req.ip;
    server {
        listen 8080;

        waf on;
        waf_inspect request ip wave=0;
        waf_capture request headers args body;

        location / {
            waf_preview request headers=8k/2k args=4k/1k body=10k;
            waf_preview request headers allow=content-type,user-agent;
            waf_preview request headers deny=x-api-key;
            waf_preview request args allow=id,page;
            waf_preview request args deny=token;
            return 204;
        }
    }
}
