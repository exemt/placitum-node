# mutate= снят: значение больше не разбирается вовсе -- ни on, ни off, ни
# третье. Ключ терпится одно поколение ради раскатки (контроллер и края едут
# порознь), строка уходит в лог как снятая. Проверять "правильность" значения
# теперь не у чего: права, которое оно включало, нет.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ (со строкой WARN):
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/mutate-bad-value.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector rewrite subject=waf.req.rewrite mutate=maybe;

    server {
        listen 8080;
        waf on;

        location / {
            return 204;
        }
    }
}
