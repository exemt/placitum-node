# Строгая семантика зоны: локальная директива без waf_shm_zone -- ошибка
# конфигурации, а не молчаливое отключение проверки. Отключённый лимит частоты
# выглядит как работающий ровно до того дня, когда он понадобится.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/local-layer-no-zone.conf
#
#     nginx: [emerg] waf: waf_local_rate requires waf_shm_zone to be declared
#
# Порядок объявления здесь тоже проверяется: waf_shm_zone ниже по файлу не
# помогла бы, потому что директива маршрута разбирается раньше.

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    server {
        listen 8080;

        waf on;

        waf_local_rate $binary_remote_addr rate=100r/s burst=200;

        location / {
            return 204;
        }
    }
}
