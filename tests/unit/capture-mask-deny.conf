# mask= и deny= -- отдельные строки, есть у headers и args, у body нет.
# deny выкидывает пару до обменника, mask оставляет имя и ставит sha256.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/capture-mask-deny.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ip subject=waf.req.ip;
    server {
        listen 8080;

        waf on;
        waf_inspect request ip wave=0;

        location / {
            waf_capture request headers=8k args=4k body=128k;
            waf_capture request headers mask=authorization,cookie;
            waf_capture request headers deny=x-internal;
            waf_capture request args mask=token;
            waf_capture request args deny=session;
            return 204;
        }

        location /none/ {
            waf_capture request headers deny=none;
            waf_capture request args mask=none;
            return 204;
        }
    }
}
