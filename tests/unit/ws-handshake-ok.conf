# Рукопожатие websocket-пути: обычный GET отказывается, расширения снимаются.
# Оба слова -- location-уровень, наследуются; off снимает унаследованное.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/ws-handshake-ok.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s;

    waf_inspector ws_rules subject=waf.frm.rules;

    waf_deny_response upgrade_required status=426;
    waf_deny_response ws_policy type=websocket code=1008;

    server {
        listen 8080;
        waf on;

        waf_ws_strip_extensions permessage-deflate;

        location /ws/ {
            waf_require_upgrade     on response=upgrade_required;
            waf_ws_strip_extensions all;
            waf_inspect frame ws_rules wave=0 timeout=5ms;
            waf_capture frame body=16k;
            return 204;
        }

        location /plain/ {
            waf_require_upgrade     off;
            waf_ws_strip_extensions off;
            return 204;
        }
    }
}
