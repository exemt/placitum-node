# Архив кадра ограничен waf_body_limit кадра: буфер шире не бывает.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: waf_archive body 128k exceeds the 65536 bytes ...

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ws_rules subject=waf.frm.rules;

    server {
        listen 8080;
        waf on;

        location /ws/ {
            waf_capture    frame body=8k;
            waf_inspect    frame ws_rules wave=0 timeout=5ms;
            waf_body_limit frame 64k block;
            waf_archive    frame body=128k ttl=1h;
            return 204;
        }
    }
}
