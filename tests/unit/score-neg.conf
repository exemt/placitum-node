# Порог −1 не грузится.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: invalid threshold "-1"

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;

    server {
        listen 8080;
        waf on;
        waf_score_deny request -1;

        location / {
            return 204;
        }
    }
}
