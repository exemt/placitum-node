# У тела нет потолка на пару: секция и так один префикс.
# выглядело бы работающим и молча игнорировало бы второе число.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/preview-body-item.conf
#
#     nginx: [emerg] waf_preview body: takes no per-item cap; the section is a
#            single prefix

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;

    waf_inspector ip subject=waf.req.ip;
    server {
        listen 8080;

        waf on;
        waf_inspect request ip wave=0;

        location / {
            waf_preview request body=4k/1k;
            return 204;
        }
    }
}
