# waf_send body=store при срезе снимка тела: тело в срезе поднимется, тело
# шире среза -- сбой подъёма по waf_exception ... body (умолчание -- отказ). Это
# не ошибка: нагрузка может всегда укладываться в срез. Но на маршруте, где на
# фазе кого-то спрашивают, nginx -t предупреждает -- строкой на объект.
# Предупреждение бывает только у ЯВНОГО store: умолчание оси -- тоже store,
# и на подставленном оно кричало бы на каждый срез, включая маршруты, где
# никто ничего не подменяет. Заголовки и строка запроса не в счёт: их правки
# ложатся по именам поверх оригинала, срез им не мешает.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ, в выводе пять предупреждений
# "cannot be served from the store": /api/ body, /pages/ body,
# /ws/ frame:c2s и frame:s2c body, /look/ body. Тихо: args=4k с args=store
# на /api/ (правки ложатся по именам), /default/ (срез без строки waf_send:
# store подставлен, а не сказан), /quiet/ (original явно), /whole/ (снимок
# целиком). /look/ предупреждает наравне с прочими: прав на подмену в
# реестре больше нет, и проверка смотрит на маршрут, а не на имена:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/send-slice-warn.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector mask  subject=waf.req.mask;
    waf_inspector dlp   subject=waf.rsp.dlp ;
    waf_inspector ws_rw subject=waf.frm.rw  ;
    waf_inspector look  subject=waf.rsp.look;

    server {
        listen 8080;
        waf on;

        # запрос: тело из обменника при срезе -- WARN; строка запроса со
        # срезом и args=store -- тихо, её правят по именам
        location /api/ {
            waf_capture request headers=8k args=4k body=16k;
            waf_inspect request mask wave=0 timeout=20ms;
            waf_send    request args=store body=store;
            return 204;
        }

        # ответ: явный store при срезе тела -- WARN
        location /pages/ {
            waf_inspect request none;
            waf_capture response headers body=10k;
            waf_inspect response dlp wave=0 timeout=100ms;
            waf_send    response body=store;
            return 204;
        }

        # кадры: явный store при срезе кадра -- WARN на обе стороны
        location /ws/ {
            waf_inspect    request none;
            waf_body_limit frame 256k block;
            waf_capture    frame body=8k;
            waf_inspect    frame ws_rw wave=0 timeout=100ms;
            waf_send       frame body=store;
            return 204;
        }

        # срез без строки waf_send: store подставлен, а не сказан -- тихо
        location /default/ {
            waf_inspect request none;
            waf_capture response headers body=10k;
            waf_inspect response dlp wave=0 timeout=100ms;
            return 204;
        }

        # срез есть, но отдаётся оригинал явно -- тихо
        location /quiet/ {
            waf_inspect request none;
            waf_capture response headers body=10k;
            waf_inspect response dlp wave=0 timeout=100ms;
            waf_send    response body=original;
            return 204;
        }

        # срез есть, store явно: предупреждение, даже если на фазе стоит
        # один наблюдатель -- прав на подмену в реестре нет, и кто из
        # спрошенных положит секцию rewrite, конфигурации не известно
        location /look/ {
            waf_inspect request none;
            waf_capture response headers body=10k;
            waf_inspect response look wave=0 timeout=100ms;
            waf_send    response body=store;
            return 204;
        }

        # снимок целиком: умолчание store, срез не режет -- тихо
        location /whole/ {
            waf_inspect request none;
            waf_capture response headers body;
            waf_inspect response dlp wave=0 timeout=100ms;
            return 204;
        }
    }
}
