# Архив и превью фазы ответа поверх её снимка: объекты те же, запись аудита
# своя, исход смотрится один на маршрут.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/archive-response-ok.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ip  subject=waf.req.ip;
    waf_inspector dlp subject=waf.rsp.dlp;

    server {
        listen 8080;
        waf on;

        waf_capture request headers=8k args=8k;
        waf_inspect request ip wave=0 timeout=5ms;

        location /api/ {
            waf_capture  response headers=8k body=64k;
            waf_capture  response headers mask=set-cookie;

            waf_archive  response headers body=8k ttl=30d when=deny;
            waf_preview  response headers=1k/256 body=2k;
            waf_preview  response headers allow=content-type,content-length;

            waf_deadline response 200ms;
            waf_exception response timeout deny;
            waf_inspect  response dlp wave=0 timeout=100ms;

            return 204;
        }
    }
}
