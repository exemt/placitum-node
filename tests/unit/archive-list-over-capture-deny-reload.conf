# Та же пара списков, что в archive-list-over-capture-deny.conf, но с reload:
# объект перекладывается оригиналом, и allow= архива применяется к нему --
# x-api-key в архив доедет, хотя снимок его выбросил.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/archive-list-over-capture-deny-reload.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ip subject=waf.req.ip;
    server {
        listen 8080;

        waf on;
        waf_inspect request ip wave=0;
        waf_capture request headers=64k args=64k;
        waf_capture request headers deny=x-api-key;
        waf_capture request args mask=token;

        location / {
            waf_archive request headers args ttl=30d when=deny;
            waf_archive request reload headers=capture;
            waf_archive request headers allow=host,x-api-key;
            # Маска архива на имя, уже хешированное снимком, без reload -- не
            # противоречие: агент его второй раз не хеширует (hashed).
            waf_archive request args mask=token;
            return 204;
        }
    }
}
