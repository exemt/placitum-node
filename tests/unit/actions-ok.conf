# Рабочие значения: умолчания в http, свои в location. Верхняя граница
# waf_actions_max и нижняя waf_action_max берутся ровно на пределе -- обе
# должны приниматься.

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;
    waf_deny_response blocked status=403;

    waf_action_max  192;
    waf_actions_max  16;

    waf_inspector ip      subject=waf.req.ip;
    waf_inspector captcha subject=waf.req.captcha;

    server {
        listen 8080;
        waf on;

        waf_inspect request ip      wave=0;
        waf_inspect request captcha wave=1;

        location / {
            return 204;
        }

        location /edge/ {
            waf_action_max   64;
            waf_actions_max  64;
            return 204;
        }
    }
}
