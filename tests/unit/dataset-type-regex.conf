# type=regex не живёт в зоне.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: dataset type "regex" is not implemented

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_shm_zone      waf 1m;

    waf_local_dataset badre type=regex limit=1024 active;

    server {
        listen 8080;
        waf on;
        location / { return 204; }
    }
}
