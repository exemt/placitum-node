# Незнакомое имя в vars= -- ошибка, а не пропуск: опечатка молча оставила бы
# инспектора без поля, на которое он рассчитывает.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: unknown field "ua" in vars= of inspector "modsec";
#            expected a built-in field, a waf_var name or "all"

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;
    waf_deny_response blocked status=403;

    waf_inspector modsec subject=waf.req.modsec vars=ua;

    server {
        listen 8080;
        waf on;

        waf_inspect request modsec wave=0;

        location / {
            return 204;
        }
    }
}
