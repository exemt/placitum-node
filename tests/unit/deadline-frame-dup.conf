# То же для бюджета: frame занял оба слота, frame:c2s следом -- повтор.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] "waf_deadline" directive is duplicate

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_inspector ip       subject=waf.req.ip;
    waf_inspector ws_rules subject=waf.frm.rules;

    server {
        listen 8080;
        waf on;

        location /ws/ {
            waf_deadline frame     5ms;
            waf_exception frame timeout deny;
            waf_deadline frame:c2s 2ms;
            waf_exception frame:c2s timeout pass;
            return 204;
        }
    }
}
