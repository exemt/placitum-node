# Три оси с разными размерами: capture кладёт снимок до волн, reload архива и
# превью докладывают оригинал после вердикта в максимум своих размеров. Конфиг
# обязан сойтись -- считать эти размеры будет горячий путь.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/redis-max-of-three.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id unit;
    waf_agent_socket /tmp/waf.sock;

    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;

    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ip subject=waf.req.ip;
    server {
        listen 8080;

        waf on;

        location / {
            waf_inspect request ip wave=0;
            waf_capture request headers=8k args=4k body=128k;
            waf_archive request reload headers=64k args=64k body=64k ttl=30d;
            waf_preview request headers=8k/2k args=4k body=10k;
            return 204;
        }
    }
}
