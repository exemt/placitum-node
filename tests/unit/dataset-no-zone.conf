# Слот списка без зоны -- ошибка, не молчаливое отключение.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: waf_local_dataset requires waf_shm_zone to be declared

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;

    waf_local_dataset office type=cidr limit=1024 internal;

    server {
        listen 8080;
        waf on;
        location / { return 204; }
    }
}
