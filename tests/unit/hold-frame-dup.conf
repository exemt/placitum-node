# Строка frame задаёт оба направления, поэтому frame:s2c следом на том же
# уровне -- повтор уже занятого слота. Разные значения по направлениям
# пишутся двумя строками с направлениями или наследованием.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] "waf_hold" directive is duplicate

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_inspector ip       subject=waf.req.ip;
    waf_inspector ws_rules subject=waf.frm.rules;

    server {
        listen 8080;
        waf on;

        location /ws/ {
            waf_hold frame     gate;
            waf_hold frame:s2c monitor;
            return 204;
        }
    }
}
