# uuid= снят: ключ слота -- имя.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: uuid= is not allowed

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_shm_zone      waf 1m;

    waf_local_dataset office type=cidr uuid=00000000-0000-0000-0000-000000000001 active;

    server {
        listen 8080;
        waf on;
        location / { return 204; }
    }
}
