# list= без ttl у правила и без ttl= у списка -- ошибка.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: waf_local_rate list= requires ttl=

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_shm_zone      waf 1m;
    waf_deny_response too_many status=429;

    waf_local_dataset blocklist type=cidr limit=1024 active;

    server {
        listen 8080;
        waf on;
        waf_local_rate $binary_remote_addr rate=5r/s burst=5
                       response=too_many list=blocklist;
        location / { return 204; }
    }
}
