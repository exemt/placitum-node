# Internal больше limit= -- ошибка на -t, не в runtime.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: dataset "office" has more than limit=2 entries

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_shm_zone      waf 1m;

    waf_local_dataset office type=cidr limit=2 internal;
    waf_local_dataset office 10.0.0.0/8 192.168.0.0/16 172.16.0.0/12;

    server {
        listen 8080;
        waf on;
        location / { return 204; }
    }
}
