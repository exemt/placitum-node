# Архив фазы ответа наследует снимок этой же фазы. Строка без снимка -- это
# "сохрани то, чего не снимали".
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: waf_archive headers is wider than capture;
#                    write reload headers=... or keep it within capture

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ip  subject=waf.req.ip;
    waf_inspector dlp subject=waf.rsp.dlp;

    server {
        listen 8080;
        waf on;

        waf_capture request headers=8k args=8k;
        waf_inspect request ip wave=0 timeout=5ms;

        location /api/ {
            waf_archive response headers ttl=30d when=deny;

            waf_deadline response 200ms;
            waf_exception response timeout deny;
            waf_inspect  response dlp wave=0 timeout=100ms;

            return 204;
        }
    }
}
