# waf_body_limit больше client_max_body_size -- ошибка конфигурации.
# Тело сверх nginx-предела до модуля не доходит (413), и директива
# описывала бы чтение, которого не бывает.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/body-limit-over-client.conf
#
#     nginx: [emerg] waf: waf_body_limit request 10240 exceeds
#                    client_max_body_size 1024

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;

    waf_inspector ip subject=waf.req.ip;
    server {
        listen 8080;

        waf on;
        waf_inspect request ip wave=0;

        location / {
            client_max_body_size 1k;
            waf_body_limit request 10k;
            return 204;
        }
    }
}
