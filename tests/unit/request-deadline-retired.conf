# Старое имя бюджета снято.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: "waf_request_deadline" no longer exists; use
#            "waf_deadline request 50ms block" instead

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;

    server {
        listen 8080;
        waf on;
        waf_request_deadline 50ms;

        location / {
            return 204;
        }
    }
}
