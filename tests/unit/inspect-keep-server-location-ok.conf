# keep=on на сервере, resume= в location: пара сходится на каждом листе,
# хотя сам сервер её не составляет. Проверка парности идёт по листьям, а не
# по уровням слияния -- иначе этот обычный раскрой был бы запрещён.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/inspect-keep-server-location-ok.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector modsec subject=waf.req.modsec;

    server {
        listen 8080;
        waf on;

        waf_capture request headers=8k args=8k;
        waf_inspect request modsec wave=0 timeout=800ms keep=on;

        location /account/ {
            waf_capture  response headers=8k body=64k;
            waf_inspect  response modsec wave=0 timeout=800ms resume=require;
            return 204;
        }

        location /leaks/ {
            waf_capture  response headers=8k body=64k;
            waf_inspect  response modsec wave=0 timeout=800ms resume=prefer;
            return 204;
        }
    }
}
