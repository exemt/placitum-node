# source= принимает только sent|original.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf_preview: source= is "sent" or "original" ...

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector dlp subject=waf.rsp.dlp;

    server {
        listen 8080;
        waf on;
        waf_inspect request none;
        location /api/ {
            waf_capture response body=8k;
            waf_inspect response dlp wave=0 timeout=100ms;
            waf_preview response body=4k source=maybe;
            return 204;
        }
    }
}
