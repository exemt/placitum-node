# allow= и deny= на строке бюджета больше нельзя: на строке с headers= и
# args= список не к чему отнести.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/preview-inline-deny.conf
#
#     nginx: [emerg] waf_preview: allow= and deny= are their own lines
#            (waf_preview request headers deny=x-api-key)

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;

    waf_inspector ip subject=waf.req.ip;
    server {
        listen 8080;

        waf on;
        waf_inspect request ip wave=0;

        location / {
            waf_preview request headers=8k deny=x-api-key;
            return 204;
        }
    }
}
