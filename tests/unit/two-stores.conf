# Обменник в контуре один.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] "waf_store" directive is duplicate

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;

    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s;
    waf_store driver=redis url=redis://127.0.0.1:6380 ttl=30s;

    server {
        listen 8080;
        waf on;

        location / {
            return 204;
        }
    }
}
