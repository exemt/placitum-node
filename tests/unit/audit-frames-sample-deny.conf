# sample= есть только у all: у deny каждый кадр с отказом пишется всегда.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf_audit_frames: sample= is only for all

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    server {
        listen 8080;
        waf on;

        location /ws/ {
            waf_audit_frames deny sample=10;
            return 204;
        }
    }
}
