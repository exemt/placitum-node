# keep=on без потребителя: состояние держится на каждом запросе, и никто за
# ним не возвращается. Память впустую -- nginx -t.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: "modsec" keeps its state on request (keep=on) but
#            no later phase resumes it in location "/api/"; add resume= on
#            response or drop keep=

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector modsec subject=waf.req.modsec;

    server {
        listen 8080;
        waf on;

        waf_capture request headers=8k args=8k;

        location /api/ {
            waf_inspect request modsec wave=0 timeout=800ms keep=on;
            return 204;
        }
    }
}
