# Два сэмпла на одном уровне не грузятся: какой из них правда -- вопрос без
# ответа, и молчаливый выбор последнего прятал бы опечатку.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] "waf_audit_sample" directive is duplicate

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    server {
        listen 8080;
        waf on;

        location / {
            waf_audit_sample 10;
            waf_audit_sample 20;
            return 204;
        }
    }
}
