# allow= / mask= архива на имя, которое deny= снимка выбросил до put, без
# reload: имени в объекте уже нет, обещание архива не сбылось бы молча.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: waf_archive headers allow= names "x-api-key", which
#            waf_capture deny= drops before the store; write waf_archive
#            reload headers=capture to take the original, or drop the name
#            from the list

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ip subject=waf.req.ip;
    server {
        listen 8080;

        waf on;
        waf_inspect request ip wave=0;
        waf_capture request headers=64k args=64k;
        waf_capture request headers deny=x-api-key;

        location / {
            waf_archive request headers ttl=30d when=deny;
            waf_archive request headers allow=host,x-api-key;
            return 204;
        }
    }
}
