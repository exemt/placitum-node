# Сборка фрагментов, ограничитель контрольных кадров и кеш вердикта кадров:
# waf_frame_reassemble on|off, waf_frame_control_rate <rate>|off,
# waf_frame_cache frame[:dir] ttl=<time> | off. Кеш требует зоны.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/frame-reassemble-ok.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s;
    waf_shm_zone waf 1m;

    waf_inspector ws_rules subject=waf.frm.rules;

    server {
        listen 8080;
        waf on;

        waf_frame_reassemble   off;
        waf_frame_control_rate off;
        waf_frame_cache        off;

        location /ws/ {
            waf_frame_reassemble   on;
            waf_frame_control_rate 20r/s;
            waf_frame_cache        frame:c2s ttl=10s;
            waf_frame_cache        frame:s2c ttl=1m;
            waf_inspect frame ws_rules wave=0 timeout=5ms;
            waf_capture frame body=16k;
            return 204;
        }

        location /both/ {
            waf_frame_control_rate 600r/m;
            waf_frame_cache        frame ttl=500ms;
            waf_inspect frame ws_rules wave=0 timeout=5ms;
            waf_capture frame body=16k;
            return 204;
        }
    }
}
