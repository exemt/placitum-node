# reload у кадра невозможен: оригинала нет, полезная нагрузка кладётся один
# раз в объёме снимка, и архив с превью берут её оттуда.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf_archive reload: a frame has no original to reload from

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ws_rules subject=waf.frm.rules;

    server {
        listen 8080;
        waf on;

        location /ws/ {
            waf_capture  frame body=64k;
            waf_inspect  frame ws_rules wave=0 timeout=5ms;
            waf_archive  frame reload body=capture ttl=1h;
            return 204;
        }
    }
}
