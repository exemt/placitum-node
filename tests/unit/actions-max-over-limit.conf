# Число действий -- множитель в бюджете сообщения, а буфер выделяется до
# публикации. Маршрут, попросивший сотню, платил бы за неё в каждом сообщении
# каждому инспектору волны.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf_actions_max must not exceed 64: the count is a
#            multiplier in the message budget

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_actions_max 100;

    server {
        listen 8080;
        waf on;

        location / {
            return 204;
        }
    }
}
