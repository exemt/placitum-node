# Направление кадра -- часть первого слова, и слов ровно два.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: write request, response, frame, frame:c2s or
#                    frame:s2c as the first word; "frame:both" is not a phase

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_inspector ip        subject=waf.req.ip;
    waf_inspector ws_rules  subject=waf.frm.rules;
    waf_inspector dlp       subject=waf.rsp.dlp;

    server {
        listen 8080;
        waf on;
        waf_deadline frame:both 5ms;
        waf_exception frame:both timeout deny;

        location / {
            return 204;
        }
    }
}
