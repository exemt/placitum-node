# Набор кадров -- это waf_inspect своей фазы, а не отдельная директива на
# направление.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: "waf_frame_inspectors_c2s" no longer exists;
#                    use "waf_inspect frame:c2s <name> wave=<n>" instead

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_inspector ip       subject=waf.req.ip;
    waf_inspector ws_rules subject=waf.frm.rules;

    server {
        listen 8080;
        waf on;

        location /ws/ {
            waf_frame_inspectors_c2s ws_rules;
            return 204;
        }
    }
}
