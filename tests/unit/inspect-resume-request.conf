# resume= на фазе запроса: продолжение фаза запроса выдаёт, а не потребляет.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: resume= belongs to the phase that consumes the
#                    continuation (response), not to request

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_inspector ip        subject=waf.req.ip;
    waf_inspector ws_rules  subject=waf.frm.rules;
    waf_inspector dlp       subject=waf.rsp.dlp;

    server {
        listen 8080;
        waf on;
        waf_inspect request ip wave=0 resume=prefer;

        location / {
            return 204;
        }
    }
}
