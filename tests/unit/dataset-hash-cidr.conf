# hash= у набора адресов: адрес и так короткий, а префикс после md5 перестаёт
# быть префиксом. Хешируются только строки.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/dataset-hash-cidr.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_shm_zone      waf 1m;

    waf_local_dataset blocklist type=cidr limit=1000 hash=md5 active;

    server {
        listen 8080;
        waf on;

        location / {
            return 204;
        }
    }
}
