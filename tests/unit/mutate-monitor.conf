# Снятый ключ mutate=on рядом с waf_hold response monitor. Обе половины больше
# не ошибка: ключ терпится одно поколение (строка WARN, значение игнорируется),
# а право подменять есть у всех, и ошибкой на monitor проверка валила бы
# законные маршруты -- отпущенный ответ разбирается в рантайме, WARN и
# applied:false.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/mutate-monitor.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector rewrite subject=waf.req.rewrite mutate=on;

    server {
        listen 8080;
        waf on;

        location /api/ {
            waf_capture  response headers body;
            waf_hold     response monitor;
            waf_deadline response 200ms;
            waf_exception response timeout pass;
            waf_inspect  response rewrite wave=0 timeout=100ms;

            return 204;
        }
    }
}
