# resume= без keep=on у того же инспектора на запросе: продолжать нечего
# никогда -- фаза запроса состояние не держала. nginx -t, а не тихая
# переигровка на каждом ответе.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: "modsec" resumes on response but its request line
#            does not keep the state in location "/leaks/"; add keep=on to
#            waf_inspect request modsec

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector modsec subject=waf.req.modsec;

    server {
        listen 8080;
        waf on;

        waf_capture request headers=8k args=8k;

        location /leaks/ {
            waf_capture  response headers=8k body=64k;

            waf_inspect  request  modsec wave=0 timeout=800ms;
            waf_inspect  response modsec wave=0 timeout=800ms resume=prefer;

            return 204;
        }
    }
}
