# Бюджет без фазы не грузится.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: write request, response or frame as the first
#            word; "50ms" is not a phase

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;

    server {
        listen 8080;
        waf on;
        waf_deadline 50ms;

        location / {
            return 204;
        }
    }
}
