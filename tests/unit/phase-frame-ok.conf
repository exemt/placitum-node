# Четыре слота фазы: request, response и два направления кадра. Строка
# frame задаёт оба, frame:s2c перекрывает одно.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/phase-frame-ok.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_inspector ip        subject=waf.req.ip;
    waf_inspector ws_rules  subject=waf.frm.rules;
    waf_inspector dlp       subject=waf.rsp.dlp;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s;

    waf_deny_response blocked   status=403;
    waf_deny_response ws_policy type=websocket code=1008
                      "reason=policy violation";

    server {
        listen 8080;
        waf on;

        waf_inspect request ip  wave=0 timeout=5ms;
        # dlp на запросе держит состояние: за ним возвращается ответ
        # (/api/, resume=prefer). Пара проверяется по листьям: keep=on стоит
        # на сервере один раз, а /ws/ перекрывает набор запроса без dlp --
        # у кадров продолжения нет, и keep=on там был бы без потребителя.
        waf_inspect request dlp wave=1 timeout=5ms keep=on;

        # обе стороны кадра одной строкой; ниже перекрывается одна
        waf_deadline frame 5ms;
        waf_exception frame timeout deny;
        waf_hold     frame gate;

        location /api/ {
            # ответ: свой бюджет, своя политика, отпускаем без удержания
            waf_hold        response monitor;
            waf_deadline    response 20ms;
            waf_exception response timeout pass;
            waf_body_limit  response 512k trim;
            waf_score_deny  response 80 response=blocked;
            waf_inspect     response dlp wave=0 timeout=20ms resume=prefer;
            return 204;
        }

        location /ws/ {
            waf_deadline    frame:s2c 2ms;
            waf_exception frame:s2c timeout pass;   # выдача важнее покрытия
            waf_hold        frame:s2c gate;       # monitor на кадрах ещё нет
            waf_body_limit  frame 256k block;
            waf_capture     frame body=64k;      # обе стороны одной строкой
            waf_score_deny  frame:c2s 80 response=ws_policy;

            # свой набор запроса без dlp: кадры транзакцию рукопожатия не
            # продолжают, resume= на них -- nginx -t
            waf_inspect     request   ip       wave=0 timeout=5ms;
            waf_inspect     frame:c2s ws_rules wave=0 timeout=5ms;
            waf_inspect     frame:s2c dlp      wave=0 timeout=5ms;
            return 204;
        }
    }
}
