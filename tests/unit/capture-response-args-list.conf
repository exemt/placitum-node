# То же для строки списка: mask= на строке запроса фазы ответа.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf_capture: phase "response" has no object "args"

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s;

    waf_inspector ip  subject=waf.req.ip;
    waf_inspector dlp subject=waf.rsp.dlp;

    server {
        listen 8080;
        waf on;
        waf_capture response args mask=token;

        location / {
            return 204;
        }
    }
}
