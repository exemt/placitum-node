# Страница проверки с набором архива, не снятым с уровня сервера. Инспекторов
# на ней нет, и это журнал: nginx -t проходит. when=deny на странице без
# инспекторов не выпадает никогда -- снять набор всё равно чище, но ошибкой
# конфигурации это больше не является.

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector captcha subject=waf.req.captcha;

    server {
        listen 8080;
        waf on;

        waf_inspect request captcha wave=0 timeout=20ms;
        waf_archive request headers args ttl=1h when=deny;

        location ^~ /waf/captcha {
            waf_inspect request none;

            return 204;
        }
    }
}
