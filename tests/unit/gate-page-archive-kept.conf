# Тот же маршрут, но набор архива с уровня сервера не снят. Архивировать без
# инспекторов нечего, и молча принять это нельзя: конфигурация выглядела бы
# пишущей в архив, не будучи ею.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/gate-page-archive-kept.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector captcha subject=waf.req.captcha;

    server {
        listen 8080;
        waf on;

        waf_inspect request captcha wave=0 timeout=20ms;
        waf_archive request headers args ttl=1h when=deny;

        location ^~ /waf/captcha {
            waf_inspect request none;

            return 204;
        }
    }
}
