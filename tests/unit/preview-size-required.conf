# Размер на объекте обязателен. Старая запись "waf_preview headers 30k"
# больше не разбирается: без "=" бюджетом был весь объект.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/preview-size-required.conf
#
#     nginx: [emerg] waf_preview: write the size on the object (headers=64k or
#            headers=64k/2k); omitting it is no longer allowed

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;

    waf_inspector ip subject=waf.req.ip;
    server {
        listen 8080;

        waf on;
        waf_inspect request ip wave=0;

        location / {
            waf_preview request headers 30k;
            return 204;
        }
    }
}
