# Пустое vars= -- ошибка: "ничего не слать" выражается отсутствием опции, а
# пустое значение чаще всего значит, что список потерялся по дороге.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: empty vars= on inspector "modsec"; drop the option
#            to send no fields

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;
    waf_deny_response blocked status=403;

    waf_inspector modsec subject=waf.req.modsec vars=,;

    server {
        listen 8080;
        waf on;

        waf_inspect request modsec wave=0;

        location / {
            return 204;
        }
    }
}
