# Своя строка archive перекрывает только названный объект: body на location
# не снимает headers родителя.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/archive-child-body.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ip subject=waf.req.ip;

    waf_capture request headers args body;
    waf_archive request headers args ttl=30d when=deny;
    waf_archive request reload headers=capture;

    server {
        listen 8080;

        waf on;
        waf_inspect request ip wave=0;

        location /api/ {
            waf_archive request body=8k;
            return 204;
        }
    }
}
