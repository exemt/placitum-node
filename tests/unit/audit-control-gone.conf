# waf_audit_control снята вместе с control=: глаголы записи (audit, archive)
# маршрут принимает от любого спрошенного инспектора. Директива из прежней
# грамматики обязана ронять -t, а не молчать.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/audit-control-gone.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s;

    waf_inspector modsec subject=waf.req.modsec;

    server {
        listen 8080;
        waf on;

        location /api/ {
            waf_audit_control modsec;
            waf_inspect request modsec wave=0;
            return 204;
        }
    }
}
