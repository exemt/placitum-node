# Старые имена pipeline не грузятся: набор -- waf_inspect.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/inspect-retired.conf
#
#     nginx: [emerg] waf: "waf_request_inspectors" no longer exists; use
#            "waf_inspect request <name> wave=<n>" instead

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;

    waf_inspector ip subject=waf.req.ip;

    server {
        listen 8080;

        waf on;
        waf_request_inspectors ip;

        location / {
            return 204;
        }
    }
}
