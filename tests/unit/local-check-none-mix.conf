# none и проверка на одном уровне противоречат друг другу: одна строка
# говорит «здесь не проверяем», вторая называет проверку.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: waf_local_check none cannot mix with checks on the same level

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_shm_zone      waf 1m;

    waf_local_dataset blocklist type=cidr limit=1000 active;

    server {
        listen 8080;
        waf on;

        location / {
            waf_local_check none;
            waf_local_check blocklist $binary_remote_addr action=block;
            return 204;
        }
    }
}
