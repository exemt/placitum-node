# Страница проверки: модуль включён ради локального слоя, инспекторов нет.
# Так держат /waf/captcha и /waf/login вместо "waf off" -- рекурсию создают
# инспекторы, а наборы края на этих ручках нужны.
#
# waf_archive request none обязателен: набор архива без инспекторов -- ошибка
# конфигурации (архивировать нечего и некому).
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/gate-page-inspect-none.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;
    waf_shm_zone waf 8m;
    # пакеты и снапшоты активных наборов -- внутренний Redis (docs/keeper.md)
    waf_sets_store driver=redis url=redis://127.0.0.1:6380;

    waf_deny_response blocked  status=403;
    waf_deny_response too_many status=429;

    waf_local_dataset cap_ipban type=cidr limit=8192 ttl=1h active;

    waf_inspector captcha subject=waf.req.captcha;

    server {
        listen 8080;
        waf on;

        waf_inspect request captcha wave=0 timeout=20ms;
        waf_archive request headers args ttl=1h when=deny;

        location ^~ /waf/captcha {
            waf_inspect request none;
            waf_archive request none;

            waf_local_check cap_ipban $binary_remote_addr action=block
                            response=blocked;
            waf_local_rate  $binary_remote_addr rate=10r/s burst=10
                            response=too_many;

            return 204;
        }

        location / {
            return 204;
        }
    }
}
