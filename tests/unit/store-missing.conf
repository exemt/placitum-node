# Обменник в контуре один и объявляется в http {}. Без него класть объекты некуда:
# инспектор получил бы локатор с unavailable на каждом запросе, а выглядело бы
# это работающей инспекцией тела. Поэтому маршрут, который что-то размещает, без
# waf_store не грузится.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/store-missing.conf
#
#     nginx: [emerg] waf: this route places headers, args, body, which needs
#            waf_store with an external driver (not none/inline)

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;

    waf_inspector modsec subject=waf.req.modsec;
    server {
        listen 8080;

        waf on;
        waf_inspect request modsec wave=0;
        waf_capture request headers args body;

        location / {
            return 204;
        }
    }
}
