# То же для лимитов: none рядом со своим лимитом -- противоречие.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: waf_local_rate none cannot mix with limits on the same level

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_shm_zone      waf 1m;

    server {
        listen 8080;
        waf on;

        location / {
            waf_local_rate $binary_remote_addr rate=5r/s burst=5;
            waf_local_rate none;
            return 204;
        }
    }
}
