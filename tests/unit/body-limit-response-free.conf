# client_max_body_size ограничивает тело клиента и только его. Предел фазы
# ответа с ним не сверяется: у ответа апстрима такого потолка не существует,
# и сверка означала бы, что чужой поток режется по чужому пределу.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/body-limit-response-free.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s;

    waf_inspector ip       subject=waf.req.ip;
    waf_inspector ws_rules subject=waf.frm.rules;

    server {
        listen 8080;
        waf on;

        client_max_body_size 1m;
        waf_body_limit request  1m block;
        waf_body_limit response 4m trim;    # больше client_max_body_size -- ок
        waf_body_limit frame    256k block;

        waf_inspect request ip wave=0 timeout=5ms;

        location / {
            return 204;
        }
    }
}
