# Archive при inspect none -- журнал, nginx -t проходит.
#
# Спрашивать некого, но запись агенту уходит, и объекты, названные в
# waf_archive, кладёт перекладка после прохода: снимка нет, архив берёт
# объект из запроса в своём размере, со списками снимка.

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ip subject=waf.req.ip;

    server {
        listen 8080;
        waf on;
        waf_inspect request none;
        waf_capture request headers args;
        waf_archive request headers;

        location / {
            return 204;
        }
    }
}
