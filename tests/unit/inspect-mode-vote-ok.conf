# mode=vote -- совещательный голос: ждут как боевого, очки идут в живую
# сумму, deny читается как 100 очков, сам не решает. Четвёртое слово у mode=,
# оно же -- управляющий глагол канала действий. Принимается на любой фазе.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/inspect-mode-vote-ok.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s;

    waf_inspector modsec  subject=waf.req.modsec;
    waf_inspector counter subject=waf.req.counter;
    waf_inspector action  subject=waf.req.action;

    server {
        listen 8080;
        waf on;

        location /search/ {
            waf_score_deny request 200;
            waf_inspect request action  wave=0;
            waf_inspect request modsec  wave=1 mode=vote;
            waf_inspect request counter wave=1 mode=vote;
            return 204;
        }

        location /ws/ {
            waf_inspect frame:c2s counter wave=0 mode=vote;
            waf_capture frame body=16k;
            return 204;
        }
    }
}
