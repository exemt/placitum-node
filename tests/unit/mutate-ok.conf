# Канал rewrite без всякого права в реестре: mutate= снят, секцию принимают от
# любой декларации. Маршрут держит ответ в gate (умолчание) и снимает тело
# целиком -- рабочая форма канала. Заодно get_timeout= обменника: свой срок
# чтения rewrite-объекта.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/mutate-ok.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m
              get_timeout=500ms;
    waf_deny_response rewrite_failed status=502;

    waf_inspector rewrite subject=waf.req.rewrite;

    server {
        listen 8080;
        waf on;

        location /api/ {
            waf_capture  response headers body;
            waf_deadline response 200ms;
            waf_exception response timeout deny;
            waf_inspect  response rewrite wave=0 timeout=100ms;

            return 204;
        }
    }
}
