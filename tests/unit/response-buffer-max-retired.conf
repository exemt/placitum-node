# Отдельного буфера удержания нет: держим ровно то, что снимает
# waf_capture response body=.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: "waf_response_buffer_max" no longer exists;
#                    use "waf_capture response body=<size>" instead

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_inspector ip       subject=waf.req.ip;
    waf_inspector ws_rules subject=waf.frm.rules;

    server {
        listen 8080;
        waf on;
        waf_response_buffer_max 256k;

        location / {
            return 204;
        }
    }
}
