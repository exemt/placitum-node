# Archive без обменника -- nginx -t.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: waf_archive requires waf_store with an
#            external driver (not none/inline)

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;

    waf_inspector ip subject=waf.req.ip;

    server {
        listen 8080;
        waf on;
        waf_inspect request ip wave=0;
        waf_capture request headers args;
        waf_archive request headers;

        location / {
            return 204;
        }
    }
}
