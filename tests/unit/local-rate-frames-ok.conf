# Локальный слой на кадрах: лимит с count=frames по ключу соединения и
# проверка опкода по набору через переменные кадра ($waf_conn_id,
# $waf_frame_opcode, $waf_frame_direction, $waf_frame_size).
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/local-rate-frames-ok.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s;
    waf_shm_zone waf 1m;
    # пакеты и снапшоты активных наборов -- внутренний Redis (docs/keeper.md)
    waf_sets_store driver=redis url=redis://127.0.0.1:6380;

    waf_local_dataset ws_opcodes type=string limit=8 internal;
    waf_local_dataset ws_opcodes text;
    waf_local_dataset blocklist  type=cidr limit=1024 active;

    waf_deny_response ws_policy type=websocket code=1008 "reason=policy violation";
    waf_deny_response ws_flood  type=websocket code=1008 "reason=too many frames";

    waf_inspector ws_rules subject=waf.frm.rules;

    server {
        listen 8080;
        waf on;

        location /ws/ {
            waf_local_check blocklist  $binary_remote_addr action=block
                            response=ws_policy;
            waf_local_check ws_opcodes $waf_frame_opcode action=wave;
            waf_local_rate  $waf_conn_id rate=50r/s burst=10 count=frames
                            action=block response=ws_flood;
            waf_local_rate  $binary_remote_addr rate=5r/s burst=5;

            waf_inspect frame ws_rules wave=0 timeout=5ms;
            waf_capture frame body=16k;
            return 204;
        }
    }
}
