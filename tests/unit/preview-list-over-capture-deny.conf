# mask= превью на имя, которое deny= снимка выбросил, без reload: превью
# читает пары запроса, но применяет запрет снимка -- имени в записи не будет,
# а маска обещала хеш.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: waf_preview args mask= names "token", which
#            waf_capture deny= drops before the store; write waf_preview
#            reload args=capture to take the original, or drop the name from
#            the list

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ip subject=waf.req.ip;
    server {
        listen 8080;

        waf on;
        waf_inspect request ip wave=0;
        waf_capture request headers=64k args=64k;
        waf_capture request args deny=token;

        location / {
            waf_preview request args=4k;
            waf_preview request args mask=token;
            return 204;
        }
    }
}
