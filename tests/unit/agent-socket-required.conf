# Сокет -- единственный выход аудита и превью. Без него запись не уезжает,
# а конфигурация выглядит пишущей в ClickHouse. Проверяется при waf on,
# не только когда назван archive.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/agent-socket-required.conf
#
#     nginx: [emerg] waf: waf_agent_socket is required when waf is on;
#            without it audit and preview never leave the worker

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id unit;

    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;

    waf_inspector ip subject=waf.req.ip;
    server {
        listen 8080;

        waf on;
        waf_inspect request ip wave=0;

        location / {
            return 204;
        }
    }
}
