# waf_require_upgrade знает одну опцию -- response=<name>: чужое слово --
# опечатка, которая иначе молча пропала бы.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf_require_upgrade: unknown option "page=blocked"

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    server {
        listen 8080;
        waf on;

        location /ws/ {
            waf_require_upgrade on page=blocked;
            return 204;
        }
    }
}
