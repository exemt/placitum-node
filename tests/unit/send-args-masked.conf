# args=store при mask=/deny= на строке запроса: правки инспектора ложатся по
# именам поверх оригинала (секция args реплая, как headers), через обменник
# строка не ходит -- маска снимка ей не мешает: замаскированное имя можно снять
# или заменить, инспектор не видел значения, но имя знает. Раньше это была
# ошибка -t (строка подменялась объектом обменника с хешами и дырами).
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/send-args-masked.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector mask subject=waf.req.mask;

    server {
        listen 8080;
        waf on;

        location /api/ {
            waf_capture request headers args;
            waf_capture request args mask=token;
            waf_inspect request mask wave=0 timeout=20ms;
            waf_send    request args=store;
            return 204;
        }
    }
}
