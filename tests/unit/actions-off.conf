# waf_actions_max 0 -- канал выключен на маршруте, и короткий waf_action_max
# рядом с ним уже не ошибка: проверять нечего, действий здесь не будет.
# Наследование вниз тоже проверяется: location переопределяет http.

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_action_max  32;
    waf_actions_max  0;

    server {
        listen 8080;
        waf on;

        location / {
            return 204;
        }

        location /api/ {
            waf_action_max  192;
            waf_actions_max   8;
            return 204;
        }
    }
}
