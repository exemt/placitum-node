# response= на несуществующую запись каталога.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: waf_exception request timeout response=nosuch:
#            waf_deny_response "nosuch" is not declared

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_deny_response blocked status=403 page=@waf_deny;
    waf_deny_response error   status=502 page=@waf_deny;

    waf_inspector modsec subject=waf.req.modsec;

    server {
        listen 8080;
        waf on;

        location / {
            waf_inspect request modsec wave=0 timeout=20ms;
            waf_exception request timeout deny response=nosuch;
            return 204;
        }

        location @waf_deny {
            return 502;
        }
    }
}
