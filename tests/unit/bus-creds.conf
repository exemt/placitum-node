# creds= на шине ещё нет.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: waf_bus option "creds" is not implemented yet

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222 creds=/tmp/nats.creds;

    server {
        listen 8080;
        waf on;

        location / {
            return 204;
        }
    }
}
