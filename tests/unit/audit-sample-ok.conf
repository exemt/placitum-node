# waf_audit_sample: доля разрешённых запросов в аудите. Наследуется вниз и
# переопределяется на маршруте -- у отладочного API свой процент, у остального
# контура свой.
#
# Границы диапазона законны обе: 100 -- писать всё (умолчание), 0 -- не писать
# ни одного разрешённого запроса. Отказы пишутся в обоих случаях.

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_audit_sample 5;

    server {
        listen 8080;
        waf on;

        location / {
            return 204;
        }

        location /debug/ {
            waf_audit_sample 100;
            return 204;
        }

        location /health {
            waf_audit_sample 0;
            return 204;
        }
    }
}
