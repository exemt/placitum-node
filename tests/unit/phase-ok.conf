# Фаза первым словом: inspect, бюджет, политики, вердикт, снимок.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/phase-ok.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked     status=403;
    waf_deny_response suspicious  status=403;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ip   subject=waf.req.ip;
    waf_inspector json subject=waf.req.json;

    waf_deadline request 50ms;
    waf_exception request timeout deny;
    waf_deny_mode request fast;
    waf_score_deny request 0;
    waf_exception request absent deny;
    waf_exception request bus pass;
    waf_exception request body deny;

    server {
        listen 8080;
        waf on;

        waf_capture request headers=64k args=64k;
        waf_capture request headers mask=cookie;
        waf_preview request headers=8k;
        waf_inspect request ip wave=0 timeout=5ms;

        location /api/ {
            waf_deadline request 30ms;
            waf_exception request timeout pass;
            waf_exception request absent deny;
            waf_deny_mode request deterministic;
            waf_score_deny request 100 response=suspicious;
            waf_inspect request ip wave=0 timeout=5ms;
            return 204;
        }

        location /account/ {
            waf_exception request absent deny;
            waf_exception response absent pass;
            waf_score_deny response 80 response=suspicious;
            waf_inspect request ip wave=0 timeout=5ms;
            waf_inspect response json wave=0 timeout=800ms;
            return 204;
        }

        location /static/ {
            waf_capture request none;
            waf_preview request none;
            waf_inspect request none;
            return 204;
        }
    }
}
