# waf_message_max снят: потолок сборки сообщения -- это waf_body_limit фазы
# кадров, и политика на превышение берётся оттуда же.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: "waf_message_max" no longer exists;
#                    use "waf_body_limit frame 256k block" instead

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_inspector ip        subject=waf.req.ip;
    waf_inspector ws_rules  subject=waf.frm.rules;
    waf_inspector dlp       subject=waf.rsp.dlp;

    server {
        listen 8080;
        waf on;

        location /ws/ {
            waf_message_max 256k;
            return 204;
        }
    }
}
