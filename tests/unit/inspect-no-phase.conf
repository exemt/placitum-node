# Фаза -- первое слово. Без неё набор не грузится.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: write request, response or frame as the first
#            word; "ip" is not a phase

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;

    waf_inspector ip subject=waf.req.ip;

    server {
        listen 8080;
        waf on;
        waf_inspect ip wave=0;

        location / {
            return 204;
        }
    }
}
