# vars= на объявлении: стандартное поле, waf_var оператора и "all" -- все три
# формы принимаются, в любом порядке относительно самой waf_var (ja3 объявлена
# ниже объявления, которое её просит: имена разрешаются после разбора http {}).

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;
    waf_deny_response blocked status=403;

    waf_inspector modsec  subject=waf.req.modsec vars=all;
    waf_inspector captcha subject=waf.req.captcha vars=user_agent,accept_language,ja3;
    waf_inspector ip      subject=waf.req.ip;

    waf_var ja3 $http_x_ja3;

    server {
        listen 8080;
        waf on;

        waf_inspect request ip      wave=0;
        waf_inspect request modsec  wave=1;
        waf_inspect request captcha wave=2;

        location / {
            return 204;
        }
    }
}
