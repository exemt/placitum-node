# Запись до объявления слота -- ошибка.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: dataset "office" is not declared

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_shm_zone      waf 1m;

    waf_local_dataset office 10.0.0.0/8;

    server {
        listen 8080;
        waf on;
        location / { return 204; }
    }
}
