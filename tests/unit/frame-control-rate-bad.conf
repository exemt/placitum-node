# Частота контрольных кадров без единицы: голое число неоднозначно, как у
# waf_local_rate.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/frame-control-rate-bad.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    server {
        listen 8080;
        waf on;

        location /ws/ {
            waf_frame_control_rate 10;
            return 204;
        }
    }
}
