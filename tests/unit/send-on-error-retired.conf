# on_error= и response= у waf_send сняты: несостоявшаяся подмена -- это сбой
# обработки запроса, и распоряжается им waf_exception <фаза> body.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: unknown option "on_error" in waf_send

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector dlp subject=waf.rsp.dlp;

    server {
        listen 8080;
        waf on;
        waf_inspect request none;

        location /api/ {
            waf_capture response body;
            waf_inspect response dlp wave=0 timeout=100ms;
            waf_send    response body=store on_error=deny;
            return 204;
        }
    }
}
