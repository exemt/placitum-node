# retain_ttl короче ttl -- ошибка конфигурации. Это срок для объектов, которые
# заберёт агент, и он по определению не может быть меньше обычного: удерживаемый
# объект живёт дольше, а не меньше остальных. Принятое наоборот значение
# выглядело бы работающим и обрезало бы ровно те объекты, ради которых
# архивация и включена.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/archive-retain-ttl.conf
#
#     nginx: [emerg] waf: retain_ttl 30000 ms is below ttl 300000 ms

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=5m retain_ttl=30s;

    server {
        listen 8080;

        location / {
            return 204;
        }
    }
}
