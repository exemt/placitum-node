# Архив и превью фазы кадров поверх снимка кадра: полезная нагрузка лежит в
# обменнике один раз, запись кадра пишется по waf_audit_frames, и названный в
# waf_archive объект остаётся агенту. Архив и превью кадра могут быть
# ШИРЕ снимка без reload: весь кадр в буфере, масок нет (в пределах
# waf_body_limit). Строки по сторонам -- каждая своё.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/archive-frame-ok.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ws_rules subject=waf.frm.rules;

    server {
        listen 8080;
        waf on;

        location /ws/ {
            # Инспекторам короткий срез, в архив -- весь кадр: у кадра нет
            # масок и он лежит в буфере целиком, reload не нужен.
            waf_capture  frame body=8k;
            waf_inspect  frame ws_rules wave=0 timeout=5ms;
            waf_body_limit frame 64k block;

            waf_archive  frame:c2s body ttl=30d when=deny;
            waf_archive  frame:s2c body=32k ttl=1h;
            waf_preview  frame     body=16k;

            return 204;
        }
    }
}
