# Записи в конфиге у active -- ошибка: состав с шины.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: entries are not allowed on active dataset "blocklist"

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_shm_zone      waf 1m;

    waf_local_dataset blocklist type=cidr limit=1024 active;
    waf_local_dataset blocklist 10.0.0.0/8;

    server {
        listen 8080;
        waf on;
        location / { return 204; }
    }
}
