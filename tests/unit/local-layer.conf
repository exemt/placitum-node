#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/local-layer.conf
#
# Проверка разбора директив локального слоя: зона, счётчики частоты, наборы
# данных и проверки маршрута. Шины здесь нет намеренно -- локальный слой не
# должен от неё зависеть на этапе загрузки конфигурации.

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_shm_zone      waf 32m;
    # пакеты и снапшоты активных наборов -- внутренний Redis (docs/keeper.md)
    waf_sets_store driver=redis url=redis://127.0.0.1:6380;

    waf_deny_response blocked   status=403;
    waf_deny_response too_many   status=429;

    waf_local_dataset blocklist type=cidr limit=100000 ttl=5m active;
    waf_local_dataset allowlist type=cidr limit=1024 active;
    waf_local_dataset badua     type=string limit=65536 active;
    waf_local_dataset tokens    type=string limit=10000 active;

    server {
        listen 8080;

        waf on;

        # Порядок объявления и есть приоритет: разрешающая проверка выше
        # запрещающих.
        waf_local_check allowlist $binary_remote_addr action=allow;
        waf_local_check tokens    $http_x_api_key     action=wave;
        waf_local_check blocklist $binary_remote_addr action=block response=blocked;
        waf_local_check badua     $http_user_agent    action=block;

        waf_local_rate $binary_remote_addr rate=100r/s burst=200;
        waf_local_rate $binary_remote_addr rate=5r/s burst=5
                       response=too_many list=blocklist;
        waf_local_rate $http_authorization rate=10r/m  burst=0 count=waves action=pass;

        location / {
            return 204;
        }

        # Наследование заменой: свой лимит вытесняет серверные целиком.
        # Проверки по наборам своей строкой не заменены, поэтому снимаются
        # словом none -- иначе они достались бы от сервера.
        location /open/ {
            waf_local_check none;
            waf_local_rate $binary_remote_addr rate=1000r/s burst=1000;
            return 204;
        }
    }
}
