# Исключение без фазы не грузится.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: write request, response, frame, frame:c2s or
#            frame:s2c as the first word; "deny" is not a phase

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;

    server {
        listen 8080;
        waf on;
        waf_exception deny response=blocked;

        location / {
            return 204;
        }
    }
}
