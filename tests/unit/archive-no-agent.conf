# Архивация без агента -- ошибка конфигурации, а не молчаливое накопление
# мусора. Удерживаемый объект модуль не удаляет: за ним придёт агент. Без
# waf_agent_socket записи аудита не будет вовсе, приходить некому, и ключи
# доживут до retain_ttl -- при десятках тысяч запросов в секунду это способ
# незаметно набить Redis.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/archive-no-agent.conf
#
#     nginx: [emerg] waf: waf_agent_socket is required when waf is on;
#            without it audit and preview never leave the worker
#
# Всё остальное здесь настроено: обменник есть, инспектор просит и заголовки, и
# тело, значит оба объекта в обменнике окажутся.

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id unit;

    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;

    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_inspector ip subject=waf.req.ip;
    server {
        listen 8080;

        waf on;
        waf_inspect request ip wave=0;
        waf_capture request headers args body;

        location / {
            waf_archive request headers body ttl=30d;
            return 204;
        }
    }
}
