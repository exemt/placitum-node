# Сравнение только через in / not in.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: "if" in waf_inspect expects "in" or "not in", got "is"

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_shm_zone      waf 1m;

    waf_deny_response blocked  status=403;
    waf_deny_response too_many status=429;

    waf_bus nats://127.0.0.1:4222;
    waf_inspector sqli subject=waf.req.sqli;

    waf_local_dataset badargs type=string limit=10000 active;
    waf_local_dataset trusted type=string limit=10000 active;

    server {
        listen 8080;
        waf on;

        waf_inspect request sqli wave=0 if $waf_request_cookies.sid is trusted;

        location / { return 204; }
    }
}
