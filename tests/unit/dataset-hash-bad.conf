# hash= принимает только md5: другой алгоритм -- другой набор, и зеркала,
# считающие по-разному, никогда не сойдутся.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/dataset-hash-bad.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_shm_zone      waf 1m;

    waf_local_dataset sessions type=string limit=1000 hash=sha1 active;

    server {
        listen 8080;
        waf on;

        location / {
            return 204;
        }
    }
}
