# Одна директива на все причины «вердикта нет»: строка без класса задаёт все
# шесть, строка с классом уточняет уровнем ниже, deny умеет назвать запись
# каталога.
#
# Проверка обязана ПРОЙТИ.

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_deny_response blocked status=403 page=@waf_deny;
    waf_deny_response error   status=502 page=@waf_deny;

    waf_inspector modsec subject=waf.req.modsec;

    waf_exception request deny response=error;

    server {
        listen 8080;
        waf on;
        waf_deadline request 40ms;

        location /api/ {
            waf_inspect request modsec wave=0 timeout=20ms;
            # шина мигнула -- пропускаем: доступность важнее покрытия
            waf_exception request bus pass;
            return 204;
        }

        location /strict/ {
            waf_inspect request modsec wave=0 timeout=20ms;
            waf_exception request timeout deny response=blocked;
            # инспектор ответил "проверить не смог" -- пятый класс
            waf_exception request inspector deny response=error;
            return 204;
        }

        location /cheap/ {
            waf_inspect request modsec wave=0 timeout=20ms;
            # сброс на входе -- шестой класс: очередь рассосётся, отказ -- нет
            waf_exception request overload pass;
            return 204;
        }

        location @waf_deny {
            return 502;
        }
    }
}
