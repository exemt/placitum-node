# resume= на кадрах: кадры инспектируются каждый сам по себе, транзакцию
# рукопожатия они не продолжают. Продолжение потребляет только ответ.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: resume= belongs to the response phase; frames are
#                    inspected on their own and do not continue the
#                    handshake transaction

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_inspector ip   subject=waf.req.ip;
    waf_inspector dlp  subject=waf.rsp.dlp;

    server {
        listen 8080;
        waf on;
        waf_inspect request ip  wave=0 timeout=5ms;
        waf_inspect request dlp wave=1 timeout=5ms keep=on;

        location /ws/ {
            waf_inspect frame:s2c dlp wave=0 timeout=5ms resume=prefer;
            return 204;
        }
    }
}
