# mask= и deny= не живут на строке набора: иначе не ясно, к какому объекту
# относится список, если названы и headers, и args.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/capture-inline-mask.conf
#
#     nginx: [emerg] waf_capture: mask= and deny= are their own lines
#            (waf_capture request headers deny=x-api-key)

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_deny_response blocked status=403;

    waf_inspector ip subject=waf.req.ip;
    server {
        listen 8080;

        waf on;
        waf_inspect request ip wave=0;

        location / {
            waf_capture request headers=8k deny=x-internal;
            return 204;
        }
    }
}
