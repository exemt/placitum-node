# Имя стандартного поля занято: user_agent едет сам, и второй источник под тем
# же ключом означал бы, что одно имя в аудите значит разное на разных узлах.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: "user_agent" is a built-in field and is sent as is;
#            pick another waf_var name

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;
    waf_deny_response blocked status=403;

    waf_var user_agent $http_user_agent;

    waf_inspector modsec subject=waf.req.modsec;

    server {
        listen 8080;
        waf on;

        waf_inspect request modsec wave=0;

        location / {
            return 204;
        }
    }
}
