# waf_send: откуда отдать объект получателю -- как пришёл (original) или
# версию инспектора из обменника (store). Четвёртая ось таблицы снимка: фаза
# первым словом, объект со значением, строки одного уровня складываются по
# объекту. Неполный снимок store не отдаёт: это сбой подъёма, которым
# распоряжается waf_exception <фаза> body,
# опции «отдать кусок» нет.
#
# Проверка обязана ЗАВЕРШИТЬСЯ УСПЕХОМ:
#
#     docker run --rm -v "$PWD/nginx/tests/unit:/t:ro" waf-nginx \
#         nginx -t -c /t/send-ok.conf

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;
    waf_store driver=redis url=redis://127.0.0.1:6379 ttl=30s retain_ttl=5m;

    waf_deny_response rewrite_failed status=502 page=@waf_deny;

    waf_inspector mask  subject=waf.req.mask;
    waf_inspector dlp   subject=waf.rsp.dlp ;
    waf_inspector ws_rw subject=waf.frm.rw  ;

    server {
        listen 8080;
        waf on;

        # запрос: тело из обменника, строка запроса с правками инспекторов
        # по именам, заголовки как пришли; сорвавшийся подъём тела -- отказ
        # страницей rewrite_failed
        location /api/ {
            waf_capture request headers args body;
            waf_inspect request mask wave=0 timeout=20ms;
            waf_send    request headers=original args=store body=store;
            return 204;
        }

        # ответ: заголовки из обменника, тело как пришло (умолчание названо явно)
        location /pages/ {
            waf_inspect request none;
            waf_capture response headers body=10k;
            waf_inspect response dlp wave=0 timeout=100ms;
            waf_send    response headers=store body=original;
            return 204;
        }

        # кадры: обе стороны одной строкой
        location /ws/ {
            waf_inspect    request none;
            waf_body_limit frame 256k block;
            waf_capture    frame body;
            waf_inspect    frame ws_rw wave=0 timeout=100ms;
            waf_send       frame body=store;
            return 204;
        }

        # одна сторона отдельно
        location /ws2/ {
            waf_inspect request none;
            waf_capture frame:c2s body=8k;
            waf_inspect frame:c2s ws_rw wave=0 timeout=100ms;
            waf_send    frame:c2s body=original;
            return 204;
        }

        location @waf_deny {
            return 502;
        }
    }
}
