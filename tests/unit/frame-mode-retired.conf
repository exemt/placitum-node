# waf_frame_mode снят: режим кадра -- это waf_hold своей фазы, а не второй
# словарь для тех же двух слов.
#
# Проверка обязана ЗАВЕРШИТЬСЯ НЕУДАЧЕЙ:
#
#     nginx: [emerg] waf: "waf_frame_mode" no longer exists;
#                    use "waf_hold frame gate|monitor" instead

load_module modules/ngx_http_waf_module.so;

events { }

http {
    waf_node_id       unit;
    waf_agent_socket /tmp/waf.sock;
    waf_bus nats://127.0.0.1:4222;

    waf_inspector ip        subject=waf.req.ip;
    waf_inspector ws_rules  subject=waf.frm.rules;
    waf_inspector dlp       subject=waf.rsp.dlp;

    server {
        listen 8080;
        waf on;

        location /ws/ {
            waf_frame_mode gate;
            return 204;
        }
    }
}
