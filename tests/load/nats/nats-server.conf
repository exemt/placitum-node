# Шина для нагрузочного стенда. Отличается от deploy/nats/nats-server.conf
# двумя вещами, и обе намеренные.
#
# JetStream выключен. Горячий путь вердикта идёт по core NATS, а аудит появится
# на этапе 8; поднятый JetStream добавил бы в замер фоновую работу с диском,
# которая к измеряемому пути отношения не имеет.
#
# Лимиты подняты под десятки тысяч сообщений в секунду.

server_name: waf-load-nats

listen: 0.0.0.0:4222
http:   0.0.0.0:8222

# Верхняя граница размера сообщения. Совпадает с боевой: инлайн тела упирается
# именно в неё, и профиль large проверяет поведение на этой границе.
max_payload: 1MB

# Потолок числа клиентов: воркер nginx держит по одному соединению, то есть
# EDGES x EDGE_WORKERS плюс инспекторы плюс экспортер.
max_connections: 4096

# Буфер медленного потребителя. Инспектор, не успевающий разбирать очередь,
# должен отключаться шиной, а не расти в памяти сервера бесконечно: так
# перегрузка видна как отключение, а не как медленно ползущая задержка.
max_pending: 64MB

# Время на запись клиенту. Меньше значения по умолчанию: залипшая запись под
# нагрузкой должна проявляться быстро.
write_deadline: 2s

debug: false
trace: false
logtime: true
