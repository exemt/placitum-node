# Балансировщик перед узлами nginx.
#
# server-template плюс resolvers на встроенный DNS docker: число узлов задаётся
# флагом --scale, а конфигурация не трогается. Открытый nginx так не умеет --
# переразрешение имён в upstream (server ... resolve) есть только в nginx Plus,
# и число узлов перестало бы быть параметром прогона.
#
# Пер-запросного лога здесь нет намеренно: httplog на десятках тысяч запросов в
# секунду сам становится статьёй расходов. Внутреннее состояние снимается через
# /metrics и страницу статистики, чего для атрибуции достаточно.

global
    # HAProxy требует примерно 2 x maxconn файловых дескрипторов и отказывается
    # стартовать, если ulimit меньше. Здесь 60000 против nofile 200000 в
    # compose: держать столько одновременных соединений локальный стенд всё
    # равно не будет, а запас на дескрипторы нужен реальный.
    maxconn     60000
    log         stdout format raw local0 notice
    # Сокета управления здесь нет намеренно: образ работает от пользователя
    # haproxy и в /var/run писать не может, а всё, что через сокет снимал бы
    # scripts/inside, отдаёт страница статистики в виде CSV по /;csv.

defaults
    mode                    http
    option                  http-keep-alive
    option                  dontlognull
    timeout connect         2s
    timeout client          30s
    timeout server          30s
    timeout http-keep-alive 30s
    timeout http-request    10s
    # Очередь к узлу не должна маскировать их насыщение: лучше отказ, который
    # виден в кодах ответа, чем ожидание, которое выглядит как медленный WAF.
    timeout queue           1s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      1s
    hold other      1s
    hold refused    1s
    hold nx         1s
    hold timeout    1s

frontend fe_load
    bind *:8080
    maxconn 60000
    default_backend be_edges

backend be_edges
    balance roundrobin

    # /healthz -- маршрут с waf off: здоровье узла не должно зависеть от
    # состояния модуля, шины или инспектора. Иначе недоступный инспектор
    # выводит узлы из балансировки и стенд перестаёт нагружать то, что изучает.
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200

    default-server inter 2s rise 1 fall 3 maxconn 20000

    # Слотов заведомо больше, чем реплик: незанятые остаются в состоянии
    # MAINT/no-addr и не мешают.
    server-template edge- 16 edge:8080 check resolvers docker init-addr none

frontend fe_stats
    bind *:8404
    monitor-uri /healthz
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
    # Встроенный экспортер: сессии, очереди, коды ответов и время отклика по
    # каждому узлу отдельно.
    http-request use-service prometheus-exporter if { path /metrics }
