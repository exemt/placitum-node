# Закрепление контейнеров за ядрами. Подключается наложением:
#
#     docker compose -f compose.load.yml -f compose.pin.yml up -d
#
# Отдельным файлом, а не частью основного, по двум причинам: раскладка зависит
# от числа ядер конкретной машины, и без закрепления генератор конкурирует за
# ядра с объектом измерения, из-за чего результат зависит от планировщика.
#
# Раскладка ниже рассчитана на 24 логических ядра, см.
# README.md#бюджет-машины. На меньшей машине файл нужно править, иначе docker
# откажется стартовать.

services:

  k6:
    cpuset: "0-3"

  haproxy:
    cpuset: "4-5"

  edge:
    cpuset: "6-11"

  origin:
    cpuset: "12-13"

  nats:
    cpuset: "14-15"

  inspector:
    cpuset: "16-18"

  prometheus:
    cpuset: "19-20"

  grafana:
    cpuset: "19-20"

  cadvisor:
    cpuset: "19-20"

  nats-exporter:
    cpuset: "19-20"
