# Приложение за WAF. Единственное требование -- быть заведомо быстрее всего
# остального в стенде, иначе измеряется оно.
#
# Ответ отдаётся через return, то есть в rewrite-фазе: ни обращения к диску, ни
# content-фазы. Тело запроса при этом отбрасывается штатным
# ngx_http_discard_request_body(), поэтому POST с телом обрабатывается без
# буферизации на диск.

worker_processes  2;

events {
    worker_connections  16384;
}

http {
    access_log  off;
    error_log   /dev/stderr  warn;

    # keepalive с edge обязателен: без него каждый проксированный запрос -- это
    # новое соединение, и стенд упирается в диапазон эфемерных портов задолго до
    # любого лимита nginx.
    keepalive_timeout   65;
    keepalive_requests  1000000;

    default_type  text/plain;

    server {
        listen  8080  backlog=16384  reuseport;

        location = /healthz {
            return 200 "ok\n";
        }

        location / {
            return 200 "origin\n";
        }
    }
}
