# Настройка CRS. Пример из поставки задаёт значения по умолчанию и оставляет
# существенное закомментированным; уровень паранойи и пороги профиль выставляет
# явно, чтобы они не менялись вместе с обновлением набора.

Include @crs-setup.conf.example

# Уровень паранойи 1 -- консервативное начало. Он поднимается по распределению
# счёта на реальном трафике в role=advisory, а не назначается вперёд: инспектор,
# выдающий высокий счёт на каждом втором запросе, заставит поднять порог
# маршрута, и все остальные инспекторы потеряют влияние на решение.
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.blocking_paranoia_level=1"

# Пороги CRS -- знаменатели калибровки score, а не пороги блокировки: блокирует
# модуль по waf_score_deny своей фазы. Штатные 5 означают "пять баллов CRS = 50
# нашей уверенности, десять = 100", см. internal/verdict. Исходящий порог штатно
# ниже входящего: утечка стоит дороже подозрительного ввода, и правил на неё
# меньше.
SecAction "id:900110,phase:1,nolog,pass,t:none,setvar:tx.inbound_anomaly_score_threshold=5,setvar:tx.outbound_anomaly_score_threshold=4"
