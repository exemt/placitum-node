# Облегчённый CRS для кадров под нагрузкой (nginx/tests/ws/load.mjs, профиль
# light). Кадр уезжает modsec как поле формы, и из всего набора по нему
# работают инъекции: SQLi и XSS. Остальные семейства -- протокол, сканеры,
# LFI/RFI/RCE, PHP, Java -- судят заголовки, метод и путь запроса, которых у
# кадра нет, и на потоке в тысячи кадров в секунду только жгут процессор.
#
# 901 и 949 обязательны: первое инициализирует переменные набора, второе
# сводит счёт по уровням паранойи в tx.blocking_inbound_anomaly_score,
# который инспектор читает. Ответной стороны у кадра нет -- RESPONSE-* не
# включаются.
Include @owasp_crs/REQUEST-901-INITIALIZATION.conf
Include @owasp_crs/REQUEST-941-APPLICATION-ATTACK-XSS.conf
Include @owasp_crs/REQUEST-942-APPLICATION-ATTACK-SQLI.conf
Include @owasp_crs/REQUEST-949-BLOCKING-EVALUATION.conf
