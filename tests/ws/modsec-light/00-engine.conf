# Настройки движка. Файлы профиля включаются в лексическом порядке имён,
# поэтому нумерация здесь значима: сначала движок, потом настройка CRS, потом
# сам CRS, потом локальная политика поверх него.
#
# @coraza.conf-recommended приезжает из поставки coraza-coreruleset и даёт то,
# что одинаково у всех: разбор тел по Content-Type (JSON, XML), лимиты, правила
# 200001/200002 на ошибку разбора тела. Директивы после него -- то, что для
# инспектора обязательно и с рекомендацией не совпадает.

Include @coraza.conf-recommended

# Решение по счёту принимает модуль по порогу маршрута, а не набор правил по
# своему: инспектор сообщает уверенность, блокирует nginx. Отсюда и то, что
# финальный deny CRS до вердикта не доходит -- он попадает в audit как
# crs_would_block, см. internal/verdict.
SecRuleEngine DetectionOnly

# Свой аудит уходит в JetStream, второй источник правды на диске не нужен.
# Путь задан явно, чтобы инициализация писателя не зависела от того, что
# осталось в рекомендованном наборе.
SecAuditEngine Off
SecAuditLog /dev/null

SecDebugLogLevel 0

# Ответная сторона включена в том же профиле: транзакция одна на весь запрос,
# и фазы 3-4 доигрываются поверх состояния фаз 1-2. Держать под них отдельный
# набор значило бы иметь две копии CRS и терять между ними ровно то, ради чего
# правила ответа и пишутся, -- контекст запроса.
SecResponseBodyAccess On

# Рекомендованный набор разбирает три типа. API отдают JSON, и без него правила
# утечек не увидят ровно тот ответ, который чаще всего и течёт.
SecResponseBodyMimeType text/plain text/html text/xml application/json

# Модуль присылает префикс в пределах waf_capture response body=, то есть тело
# уже усечено маршрутом. Второе усечение движком дало бы RESBODY-ошибку на
# ровном месте: разбирать надо то, что дали.
SecResponseBodyLimitAction ProcessPartial
