# Стенд кадров: nginx с модулем перед WebSocket-приложением, NATS, Redis и
# поддельный инспектор кадров.
#
# Рукопожатие -- обычный HTTP-запрос, и оно проходит фазу request целиком,
# включая локальный слой. После 101 соединение забирает обработчик кадров:
# каждый кадр данных лежит в буфере до вердикта (gate) -- в обе стороны, один
# кадр в полёте на соединение. /ws/ спрашивает только кадры клиента, /ws2/ --
# обе стороны, со счётчиком и подменой полезной нагрузки.

load_module modules/ngx_http_waf_module.so;

events { }

error_log /dev/stdout info;

http {
    access_log off;

    waf_node_id       ws;
    # Приёмник записей аудита -- agent.go стенда шины на общем томе.
    waf_agent_socket /run/waf/agent.sock;
    waf_bus          nats://nats:4222;

    # Полезная нагрузка кадра едет инспектору локатором, как тело на других
    # фазах: без обменника инспектор увидел бы только кадрирование.
    waf_store driver=redis url=redis://redis:6379 ttl=30s retain_ttl=5m;

    # Состояние живых наборов (blocklist ниже) -- внутренний Redis; на стенде
    # он тот же, что обменник.
    waf_sets_store driver=redis url=redis://redis:6379;

    waf_shm_zone waf 1m;

    waf_local_dataset badua type=string limit=16 internal;
    waf_local_dataset badua sqlmap/1.0;

    # Локальный слой на кадрах: опкод против набора (переменная кадра).
    waf_local_dataset ws_binary type=string limit=8 internal;
    waf_local_dataset ws_binary binary;

    # Живой набор адресов: состав приезжает с keeper (на стенде -- keeper.mjs),
    # пишет в него счётчик по квоте. Проверяется и на рукопожатии, и на
    # каждом кадре /quota/.
    waf_local_dataset blocklist type=cidr limit=1024 ttl=5m active;

    waf_deny_response blocked   status=403;
    waf_deny_response ws_policy type=websocket code=1008
                      "reason=policy violation";
    waf_deny_response ws_flood  type=websocket code=1008
                      "reason=too many frames";
    waf_deny_response upgrade_required status=426;

    # Настоящий modsec на кадрах: тот же образ и профиль default, что на
    # запросах. Кадр уезжает ему как POST на адрес рукопожатия с одним
    # аргументом формы, и CRS судит его как поле формы.
    waf_inspector modsec subject=waf.frm.modsec profile=default;

    # Контракт сообщений: профиль ws из поставки инспектора json -- чат с
    # двумя типами сообщений, msg и join, по схеме на тип. Всё, что под схему
    # не подходит, контрактом не описано и на стороне клиента -- отказ.
    waf_inspector json subject=waf.frm.json profile=ws;

    # Счётчик на обе стороны: кадры клиента штуками по соединению, байты
    # приложения по адресу. Подмена полезной нагрузки в обе стороны: слово
    # клиента маскируется до апстрима, секрет приложения -- до клиента.
    waf_inspector counter subject=waf.frm.counter profile=ws;
    waf_inspector rewrite subject=waf.frm.rewrite profile=ws;

    # Нагрузка (load.mjs): те же процессы, другие профили. Облегчённый CRS
    # (SQLi и XSS, каталог modsec-light рядом с этим файлом, в контейнер
    # подмонтирован как profiles/http/light) и счётчик входа/выхода с
    # корзинами, которые честный клиент не заполняет (профиль wsload образа).
    waf_inspector modsec_light subject=waf.frm.modsec  profile=light;
    waf_inspector counter_load subject=waf.frm.counter profile=wsload;

    # Квота (/quota/): те же процессы, профили ws_quota. Счётчик первой
    # волной меряет две корзины и просит rewrite (mutate) отвечать ошибкой,
    # rewrite второй волной подменяет кадр; переполнение второй корзины --
    # адрес в blocklist через keeper.
    waf_inspector counter_quota subject=waf.frm.counter profile=ws_quota;
    waf_inspector rewrite_quota subject=waf.frm.rewrite profile=ws_quota
                  mutate=on;

    # Нагрузка (load.mjs, /ladder/): та же лестница квоты, но корзины на
    # десятки миллионов -- порог не берётся, меряется цена пути «две корзины
    # → просьба → rewrite» на каждом кадре обеих сторон.
    waf_inspector counter_ladder subject=waf.frm.counter profile=ws_ladder;

    upstream ws_app {
        server echo:9001;
    }

    server {
        listen 8080;

        waf on;
        waf_debug_header on;

        waf_capture request headers=8k args=8k;
        waf_inspect request none;

        location /ws/ {
            # Рукопожатие -- обычный запрос: адрес, Origin, путь, UA. Всё это
            # локальный слой умеет уже сегодня.
            waf_local_check badua $http_user_agent action=block
                            response=blocked;

            # Сборка фрагментов: сообщение судится целиком и уходит
            # получателю одним кадром. Кеш вердикта: тот же кадр клиента
            # десять секунд шину не видит -- инспекторы здесь судят по
            # содержимому, и повтор ничего не изменит.
            waf_frame_reassemble on;
            waf_frame_cache      frame:c2s ttl=10s;

            # Кадры клиента: снять полезную нагрузку, спросить, держать до
            # вердикта. Бюджеты щедрые -- стенд меряет покрытие, не скорость.
            waf_capture    frame:c2s body=64k;
            waf_body_limit frame:c2s 64k block;

            # Разбор инцидента: срез нагрузки в записи кадра (та же
            # body_preview, что у тела) и архив отказанного кадра -- объект
            # остаётся в обменнике агенту. Запись у /ws/ по умолчанию deny, и
            # архив едет только с ней: пропущенный кадр снимается сразу.
            waf_preview    frame:c2s body=512;
            waf_archive    frame:c2s body ttl=1h when=deny;

            waf_inspect    frame:c2s modsec wave=0 timeout=500ms;
            waf_inspect    frame:c2s json   wave=0 timeout=500ms;
            waf_deadline   frame:c2s 1s;
            waf_exception frame:c2s timeout deny;
            waf_hold       frame:c2s gate;

            # Инъекция в кадре набирает у CRS ровно порог аномалии, а это
            # score 50 по калибровке инспектора: порог маршрута стоит там же,
            # и отказ по нему уходит клиенту кадром Close из записи ws_policy.
            waf_score_deny frame:c2s 50 response=ws_policy;

            proxy_pass http://ws_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;

            proxy_read_timeout 30s;
        }

        # Нагрузка (load.mjs): две ступени под /ws/, чтобы цена раскладывалась
        # по слоям. /echo/ -- эталон стенда: waf off, контекста фазы запроса
        # нет, и обработчик кадров к соединению не цепляется -- чистое
        # проксирование. /frames/ -- модуль без инспекторов: кадрирование,
        # снимок в обменник и gate, но спрашивать некого, вердикт на месте.
        location /echo/ {
            waf off;

            proxy_pass http://ws_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;

            proxy_read_timeout 30s;
        }

        location /frames/ {
            waf_capture    frame:c2s body=64k;
            waf_body_limit frame:c2s 64k block;
            waf_hold       frame:c2s gate;

            proxy_pass http://ws_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;

            proxy_read_timeout 30s;
        }

        # Нагрузка (load.mjs): раскладка боевого маршрута чата. Счётчик на
        # обеих сторонах -- кадры клиента по соединению, байты приложения по
        # адресу, -- и облегчённый CRS на кадрах клиента. Обе стороны держатся
        # до вердикта: monitor на кадрах модуль пока не умеет (nginx -t
        # отвергает), так что и выдача приложения ждёт счётчика.
        location /pipe/ {
            waf_capture    frame body=64k;
            waf_body_limit frame 64k block;

            waf_inspect    frame:c2s counter_load wave=0 timeout=500ms;
            waf_inspect    frame:c2s modsec_light wave=0 timeout=500ms;
            waf_inspect    frame:s2c counter_load wave=0 timeout=500ms;
            waf_hold       frame gate;
            waf_deadline   frame 1s;
            waf_exception frame timeout deny;
            waf_score_deny frame 50 response=ws_policy;

            proxy_pass http://ws_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;

            proxy_read_timeout 30s;
        }

        # Обе стороны: одна строка frame настраивает оба слота. Счётчик
        # бежит первой волной, подмена -- второй: подменённый кадр уходит
        # получателю вместо оригинала, с тем же опкодом и fin.
        location /ws2/ {
            # Рукопожатие: обычный GET сюда не ходит, сжатие не согласуется --
            # сжатые кадры шли бы мимо инспекции.
            waf_require_upgrade     on response=upgrade_required;
            waf_ws_strip_extensions permessage-deflate;

            # Аудит каждого спрошенного кадра, не только отказов: стенд
            # смотрит и на записи пропущенных и подменённых кадров.
            waf_audit_frames all;

            # Сборка: подмена видит сообщение целиком, а не куски. Кеш здесь
            # включён, но счётчик отвечает "cache": false -- его вердикт не
            # про содержимое, и повтор кадра судится заново.
            waf_frame_reassemble on;
            waf_frame_cache      frame ttl=10s;

            # Снимок целиком, а не срезом: у кадра шире среза подмена
            # сорвалась бы подъёмом (partial), а тут проверяется сама подмена.
            waf_capture    frame body;
            waf_body_limit frame 64k block;
            # source=sent: в записи -- доставленная версия подменённого кадра
            # ("hello ***" вместо "hello badword"), не оригинал. Архива здесь
            # нет; обменник после прогона обязан остаться без объектов /ws2/.
            waf_preview    frame body=256 source=sent;
            waf_inspect    frame counter wave=0 timeout=500ms;
            waf_inspect    frame rewrite wave=1 timeout=500ms;
            waf_deadline   frame 2s;
            waf_exception frame timeout deny;
            waf_score_deny frame 50 response=ws_policy;

            proxy_pass http://ws_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;

            proxy_read_timeout 30s;
        }

        # Локальный слой на кадрах: до шины на каждом спрошенном кадре
        # бегут проверки маршрута по наборам и лимиты count=frames, а ping
        # сверх частоты не пересылается. Инспектор здесь -- счётчик, до
        # него доходят только кадры, прошедшие локальный слой.
        # Квота: лестница из двух корзин счётчика. Третий кадр подряд --
        # rewrite по просьбе счётчика отвечает ошибкой вместо эха; шестой
        # кладёт адрес в blocklist, и локальный слой закрывает сессию на
        # следующем кадре, а новое рукопожатие с адреса получает 403.
        location /quota/ {
            waf_local_check blocklist $binary_remote_addr action=block
                            response=blocked;

            waf_audit_frames all;
            # Снимок целиком, а не срезом: у кадра шире среза подмена
            # сорвалась бы подъёмом (partial), а тут проверяется сама подмена.
            waf_capture    frame:c2s body;
            waf_body_limit frame:c2s 64k block;
            waf_inspect    frame:c2s counter_quota wave=0 timeout=500ms;
            # rewrite стоит выключенным и включается счётчиком (active): пока
            # корзина под порогом, второй волны нет вовсе -- ни сообщения, ни
            # объекта в обменнике.
            waf_inspect    frame:c2s rewrite_quota wave=1 timeout=500ms
                           mode=off;
            waf_deadline   frame:c2s 2s;
            waf_exception frame:c2s timeout deny;

            proxy_pass http://ws_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;

            proxy_read_timeout 30s;
        }

        # Нагрузка (load.mjs): лестница квоты под потоком. Счётчик первой
        # волной на обеих сторонах (две корзины по кадрам клиента, байты
        # приложения), rewrite второй волной по просьбе, сборка фрагментов
        # включена: сообщение судится целиком в обе стороны. Корзины
        # неприличные -- порог не берётся, и это цена самого пути.
        location /ladder/ {
            waf_local_check blocklist $binary_remote_addr action=block
                            response=blocked;

            waf_frame_reassemble on;

            # Снимок целиком, а не срезом: у кадра шире среза подмена
            # сорвалась бы подъёмом (partial), а тут проверяется сама подмена.
            waf_capture    frame body;
            waf_body_limit frame 64k block;
            waf_inspect    frame counter_ladder wave=0 timeout=500ms;
            waf_inspect    frame rewrite_quota  wave=1 timeout=500ms
                           mode=off;
            waf_hold       frame gate;
            waf_deadline   frame 1s;
            waf_exception frame timeout deny;

            proxy_pass http://ws_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;

            proxy_read_timeout 30s;
        }

        location /local/ {
            waf_local_check ws_binary $waf_frame_opcode action=block
                            response=ws_policy;
            waf_local_rate  $waf_conn_id rate=2r/s burst=2 count=frames
                            action=block response=ws_flood;
            waf_frame_control_rate 2r/s;

            waf_capture    frame:c2s body=64k;
            waf_body_limit frame:c2s 64k block;
            waf_inspect    frame:c2s counter wave=0 timeout=500ms;
            waf_deadline   frame:c2s 2s;
            waf_exception frame:c2s timeout deny;

            proxy_pass http://ws_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;

            proxy_read_timeout 30s;
        }

        # Журнал без инспекторов кадров: waf_audit_frames all пишет каждый
        # кадр обеих сторон со срезом нагрузки, архив c2s оставляет объект
        # кадра агенту. Кадры уходят получателю, никого не дожидаясь, а
        # сессия закрывается итогом, как у спрошенной.
        location /journal/ {
            waf_audit_frames all;
            waf_preview    frame body=256;
            waf_archive    frame:c2s body ttl=1h;

            proxy_pass http://ws_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;

            proxy_read_timeout 30s;
        }

        # Ни инспекторов, ни записи кадров: обработчик цепляется ради итога
        # сессии, нагрузка идёт потоком в обе стороны.
        location /quiet/ {
            proxy_pass http://ws_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;

            proxy_read_timeout 30s;
        }
    }
}
