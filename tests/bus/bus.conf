# Стенд волн: nginx с модулем, NATS и поддельные инспекторы.
#
# Обменник настоящий (Redis): волна публикуется только после размещения
# объектов, и без обменника эта половина пути не проверялась бы вовсе. Тела нет --
# у него свой прогон, tests/body.
#
# Каждый маршрут -- одна ветка разрешения вердикта. Инспекторы отвечают тем,
# что им сказано в окружении, поэтому ветка выбирается маршрутом, а не
# содержимым запроса.

load_module modules/ngx_http_waf_module.so;

events { }

error_log /dev/stdout info;

http {
    access_log off;

    waf_node_id       bus;
    waf_agent_socket /run/waf/agent.sock;
    waf_bus          nats://nats:4222;

    waf_store driver=redis url=redis://redis:6379 ttl=30s retain_ttl=5m;

    waf_deny_response blocked    status=403;
    waf_deny_response suspicious status=418;

    waf_inspector allower subject=waf.req.allow;
    waf_inspector scorer  subject=waf.req.score;
    waf_inspector denier  subject=waf.req.deny;
    waf_inspector mute    subject=waf.req.mute;

    # Отправители действий. Форму канала закрывают четверо: один говорит
    # правильно, трое -- каждый своей ошибкой, и ошибки эти разного веса.
    # Незнакомый адресат стоит действия, незнакомый глагол или ось -- всего
    # ответа: принять действие, которого не понимает ни модуль, ни получатель,
    # значит потратить бюджет на мусор.
    waf_inspector asker         subject=waf.req.ask;
    waf_inspector asker_unknown subject=waf.req.ask.unknown;
    waf_inspector asker_badverb subject=waf.req.ask.badverb;
    waf_inspector asker_badaxis subject=waf.req.ask.badaxis;

    # Поддельная калитка: отвечает секцией sessions -- «я узнал вот этих».
    # Модуль их не толкует, а возвращает соседям следующих волн и фаз: по ним
    # ключует свои корзины счётчик.
    waf_inspector gate          subject=waf.req.gate;

    # Очки на маршруте: исполняет модуль, поля to нет, знак свободен.
    waf_inspector pointer       subject=waf.req.points;
    waf_inspector cutter        subject=waf.req.cut;

    # Глаголы записи: просит писать запрос в журнал и оставить заголовки
    # агенту со своим сроком. Что из этого исполнится, решает грант маршрута.
    # Заодно назначает и запись ответа (apply response): там, где фаза
    # ответа бежит, просьба дождётся её записи.
    waf_inspector auditor       subject=waf.req.audit;

    # То же с фазы ответа: обе записи, в том числе запись запроса, которая
    # на маршруте с грантом ждёт исхода.
    waf_inspector rsp_auditor   subject=waf.rsp.audit;

    # Молчаливый allow на фазе запроса: кладёт объекты запроса в обменник
    # там, где просьбы про запрос приходят только с фазы ответа.
    waf_inspector req_quiet     subject=waf.req.quiet;

    # Фаза ответа: свои имена и свои subject. Одно имя на две фазы тоже
    # допустимо, но тогда в логе стенда не отличить, чью волну видно.
    waf_inspector rsp_allow subject=waf.rsp.allow;
    waf_inspector rsp_deny  subject=waf.rsp.deny;

    # Тянет время: пока он думает, стенд успевает заглянуть в обменник.
    waf_inspector rsp_slow  subject=waf.rsp.slow;

    # Настоящий инспектор, а не подделка: тот самый образ, который поедет в
    # продакшен, с профилем profiles/response и движком CRS.
    waf_inspector modsec        subject=waf.rsp.modsec profile=default;

    # Тот же процесс инспектора, другой профиль: правило 950100 (утечка
    # 500-го статуса) объявлено уровнем паранойи 2, и при уровне 1 оно
    # находится, но веса не даёт. Разница между профилями здесь и проверяется.
    waf_inspector modsec_strict subject=waf.rsp.modsec profile=strict;

    # Фикстура фазы 4: одно своё правило на RESPONSE_BODY, без CRS. Отвечает на
    # вопрос «правила ответной стороны исполняются?» так, что ответ не зависит
    # от версии набора.
    waf_inspector modsec_canary subject=waf.rsp.modsec profile=canary;

    # Отдельный экземпляр с выключенным реестром липкости
    # (WAF_MODSEC_RESUME_MAX=0): continue он не выдаёт никогда. На нём видно,
    # что делает маршрут, когда состояния нет: prefer переигрывает, require
    # отказывает. Своё имя -- потому что пара keep/resume связывается по
    # имени, и пересекаться с рабочим modsec она не должна.
    waf_inspector modsec_lost   subject=waf.rsp.modsec.lost profile=default;

    server {
        listen 8080;

        waf on;
        waf_debug_header on;

        root /usr/share/nginx/html;

        waf_capture  request headers=8k args=8k;
        waf_deadline request 2s;
        waf_exception request timeout deny;

        # Один инспектор, вердикт allow.
        location /allow/ {
            alias /usr/share/nginx/html/;
            waf_inspect request allower wave=0 timeout=1s;
        }

        # Счёт ниже порога: запрос проходит, счёт виден в диагностике.
        location /score-under/ {
            alias /usr/share/nginx/html/;
            waf_score_deny request 90;
            waf_inspect request scorer wave=0 timeout=1s;
        }

        # Тот же счёт при пороге ниже: отказ по сумме, страница из каталога.
        location /score-over/ {
            alias /usr/share/nginx/html/;
            waf_score_deny request 50 response=suspicious;
            waf_inspect request scorer wave=0 timeout=1s;
        }

        # Явный deny инспектора со своей страницей.
        location /deny/ {
            alias /usr/share/nginx/html/;
            waf_inspect request denier wave=0 timeout=1s;
        }

        # Две волны: вторая публикуется только после ответа первой.
        location /waves/ {
            alias /usr/share/nginx/html/;
            waf_inspect request allower wave=0 timeout=1s;
            waf_inspect request scorer  wave=1 timeout=1s;
            waf_score_deny request 90;
        }

        # Молчун и короткий дедлайн: политика фазы решает исход.
        location /timeout-block/ {
            alias /usr/share/nginx/html/;
            waf_deadline request 200ms;
            waf_exception request timeout deny;
            waf_inspect request mute wave=0 timeout=200ms;
        }

        location /timeout-pass/ {
            alias /usr/share/nginx/html/;
            waf_deadline request 200ms;
            waf_exception request timeout pass;
            waf_inspect request mute wave=0 timeout=200ms;
        }

        # --- фаза ответа ---------------------------------------------------
        #
        # Ответ удерживается до вердикта: заголовки не уходят в сеть, тело
        # копится в контексте. При allow всё это отдаётся клиенту как было.
        location /rsp-allow/ {
            alias /usr/share/nginx/html/;

            waf_deadline response 2s;
            waf_exception response timeout deny;
            waf_inspect  response rsp_allow wave=0 timeout=1s;
        }

        # Отказ на фазе ответа: клиент не должен увидеть ни байта ответа
        # приложения, а получить страницу каталога.
        location /rsp-deny/ {
            alias /usr/share/nginx/html/;

            waf_deadline response 2s;
            waf_exception response timeout deny;
            waf_inspect  response rsp_deny wave=0 timeout=1s;
        }

        # Обе фазы на одном маршруте: фаза запроса кладёт объекты в обменник, и
        # фаза ответа обязана привезти их инспектору секцией request_store.
        location /both/ {
            alias /usr/share/nginx/html/;

            waf_inspect  request  allower  wave=0 timeout=1s;
            waf_deadline response 2s;
            waf_exception response timeout deny;
            waf_inspect  response rsp_allow wave=0 timeout=1s;
        }

        # Объекты фазы запроса обязаны дожить до вердикта фазы ответа: их
        # ключи уехали инспектору секцией request_store, и удалить их по
        # вердикту своей фазы значило бы прислать ключ, по которому уже
        # ничего нет.
        location /rsp-hold/ {
            alias /usr/share/nginx/html/;

            waf_inspect  request  allower  wave=0 timeout=1s;
            waf_deadline response 10s;
            waf_exception response timeout deny;
            waf_inspect  response rsp_slow wave=0 timeout=10s;
        }

        # Настоящий modsec на фазе ответа. Приложение отвечает 500, правило
        # CRS 950100 (application error disclosure) срабатывает в фазе 3, счёт
        # переходит порог маршрута -- и отказывает модуль, а не движок.
        location /rsp-modsec/ {
            proxy_pass http://127.0.0.1:8080/fail/;

            waf_deadline   response 3s;
            waf_exception response timeout deny;
            waf_score_deny response 50 response=suspicious;
            waf_inspect    response modsec_strict wave=0 timeout=3s;
        }

        # Чистый ответ тем же инспектором: находок нет, запрос проходит.
        location /rsp-modsec-ok/ {
            proxy_pass http://127.0.0.1:8080/ok/;

            waf_deadline   response 3s;
            waf_exception response timeout deny;
            waf_score_deny response 50 response=suspicious;
            waf_inspect    response modsec wave=0 timeout=3s;
        }

        # Апстрим стенда: он же nginx, только другой маршрут. Отдельного
        # приложения ради двух ответов заводить незачем.
        location /fail/ {
            waf off;
            return 500 "internal error\n";
        }

        location /ok/ {
            waf off;
            return 200 "{\"id\":1}\n";
        }

        # monitor: ответ уходит сразу, вердикт идёт вслед. Отказ здесь не
        # рисует страницу -- он обрывает соединение, и клиент видит усечённый
        # ответ, а не 403.
        location /rsp-monitor/ {
            alias /usr/share/nginx/html/;

            waf_hold       response monitor;
            waf_deadline   response 2s;
            waf_exception response timeout deny;
            waf_inspect    response rsp_allow wave=0 timeout=1s;
        }

        # --- снимок фазы ответа ------------------------------------------------
        #
        # Заголовки и тело ответа едут инспектору объектами обменника, со своими
        # mask= и deny=. До этого они шли инлайном, и списков к ним применять
        # было нечего.
        location /rsp-capture/ {
            alias /usr/share/nginx/html/;

            waf_capture  response headers=8k body=64k;
            waf_capture  response headers mask=etag;
            waf_capture  response headers deny=x-waf-debug;

            waf_deadline response 3s;
            waf_exception response timeout deny;
            waf_inspect  response rsp_allow wave=0 timeout=2s;
        }

        # Липкая транзакция: тот же инспектор на обеих фазах. Фаза запроса
        # оставляет транзакцию открытой и называет свой личный subject, фаза
        # ответа доигрывает 3-4 поверх неё. У правил ответа при этом настоящий
        # контекст запроса, а не переигранный, и входящий счёт посчитан один
        # раз -- своей фазой.
        location /rsp-sticky/ {
            proxy_pass http://127.0.0.1:8080/leak/;
            proxy_http_version 1.1;

            waf_capture    response headers=8k body=64k;

            waf_deadline   request  3s;
            waf_exception request timeout deny;
            waf_inspect    request  modsec wave=0 timeout=3s keep=on;

            waf_deadline   response 3s;
            waf_exception response timeout deny;
            waf_score_deny response 50 response=suspicious;
            waf_inspect    response modsec wave=0 timeout=3s resume=prefer;
        }

        # Состояние потеряно: экземпляр modsec_lost continue не выдаёт вовсе.
        # Та же пара keep/resume, тот же маршрут к утечке, но фаза ответа
        # приходит в групповой subject без транзакции. prefer -- переигровка:
        # утечка всё равно найдена, resumed=false. Это деградация, а не
        # потеря проверки.
        location /rsp-lost-prefer/ {
            proxy_pass http://127.0.0.1:8080/leak/;
            proxy_http_version 1.1;

            waf_capture    response headers=8k body=64k;

            waf_deadline   request  3s;
            waf_exception request timeout deny;
            waf_inspect    request  modsec_lost wave=0 timeout=3s keep=on;

            waf_deadline   response 3s;
            waf_exception response timeout deny;
            waf_score_deny response 50 response=suspicious;
            waf_inspect    response modsec_lost wave=0 timeout=3s resume=prefer;
        }

        # То же с require: без состояния инспектор отказывает сам --
        # MODSEC_RESUME_LOST и error в его логе. Ответ приложения чистый
        # (/ok/, без утечки): отказ здесь только от потери состояния,
        # а не от правил.
        location /rsp-lost-require/ {
            proxy_pass http://127.0.0.1:8080/ok/;
            proxy_http_version 1.1;

            waf_capture    response headers=8k body=64k;

            waf_deadline   request  3s;
            waf_exception request timeout deny;
            waf_inspect    request  modsec_lost wave=0 timeout=3s keep=on;

            waf_deadline   response 3s;
            waf_exception response timeout deny;
            waf_inspect    response modsec_lost wave=0 timeout=3s resume=require;
        }

        # Отказ раньше нашей волны. modsec на фазе запроса оставляет
        # транзакцию открытой -- маршрут обещал спросить его на ответе, -- но
        # denier в той же волне отказывает, и фазы ответа не будет вовсе.
        # Экземпляр обязан узнать об этом сообщением, а не по истечении срока.
        location /rsp-abandoned/ {
            alias /usr/share/nginx/html/;

            waf_deadline   request  3s;
            waf_exception request timeout deny;
            waf_inspect    request  modsec wave=0 timeout=3s keep=on;
            waf_inspect    request  denier wave=0 timeout=1s;

            waf_capture    response headers=8k body=64k;
            waf_deadline   response 3s;
            waf_exception response timeout deny;
            waf_inspect    response modsec wave=0 timeout=3s resume=prefer;
        }

        # Утечка в теле ответа: фаза 4 движка правил. Ровно тот случай, ради
        # которого фазу ответа и заводят -- запрос был безобидным, отвечает
        # приложение. Липкости здесь нет: инспектор фазы ответа состояния не
        # получал и переигрывает фазы 1-2 по контексту из сообщения.
        location /rsp-leak/ {
            proxy_pass http://127.0.0.1:8080/leak/;
            proxy_http_version 1.1;      # иначе апстрим не сожмёт: gzip_http_version

            waf_capture    response headers=8k body=64k;

            # Запись аудита фазы ответа: срез уходит агенту, объекты остаются
            # в обменнике на его срок.
            waf_preview    response headers=1k/256 body=2k;
            waf_archive    response headers body=8k ttl=1h when=deny;
            waf_deadline   response 3s;
            waf_exception response timeout deny;
            waf_score_deny response 50 response=suspicious;
            waf_inspect    response modsec wave=0 timeout=3s;
        }

        # Апстрим отвечает сжатым, если его об этом просят: маршрут со снимком
        # тела не должен просить, иначе инспектору достанется gzip.
        # Тот же маршрут с выключенным снятием: апстрим сжимает, инспектору
        # достаётся gzip, и утечка проходит. Это не баг, а цена настройки --
        # и она обязана быть видимой.
        location /rsp-leak-gz/ {
            proxy_pass http://127.0.0.1:8080/leak/;
            proxy_http_version 1.1;

            waf_strip_accept_encoding off;

            waf_capture    response headers=8k body=64k;
            waf_deadline   response 3s;
            waf_exception response timeout deny;
            waf_score_deny response 50 response=suspicious;
            waf_inspect    response modsec wave=0 timeout=3s;
        }

        # Канарейка в теле: маршрут отдаёт метку, правило фазы 4 её находит,
        # порог маршрута превращает находку в отказ. Ни CRS, ни уровня
        # паранойи здесь нет -- только фаза.
        location /rsp-canary/ {
            proxy_pass http://127.0.0.1:8080/canary/;
            proxy_http_version 1.1;

            waf_capture    response headers=8k body=64k;
            waf_deadline   response 3s;
            waf_exception response timeout deny;
            waf_score_deny response 50 response=suspicious;
            waf_inspect    response modsec_canary wave=0 timeout=3s;
        }

        location /canary/ {
            waf off;
            default_type text/html;
            return 200 "<html><body>token WAF-CANARY-0badc0de leaked</body></html>";
        }

        # Та же метка, но в заголовке ответа: правило смотрит в тело, значит не
        # находит. Без этого маршрута предыдущий доказывал бы только то, что
        # движок где-то нашёл подстроку.
        location /rsp-canary-hdr/ {
            proxy_pass http://127.0.0.1:8080/canary-hdr/;
            proxy_http_version 1.1;

            waf_capture    response headers=8k body=64k;
            waf_deadline   response 3s;
            waf_exception response timeout deny;
            waf_score_deny response 50 response=suspicious;
            waf_inspect    response modsec_canary wave=0 timeout=3s;
        }

        location /canary-hdr/ {
            waf off;
            default_type text/html;
            add_header X-Debug-Token "WAF-CANARY-0badc0de" always;
            return 200 "<html><body>ok</body></html>";
        }

        location /leak/ {
            waf off;
            gzip on;
            gzip_types text/html;
            gzip_min_length 1;
            add_header X-Saw-Accept-Encoding "$http_accept_encoding" always;
            default_type text/html;
            return 200 "<html><body>You have an error in your SQL syntax; check the manual that corresponds to your MySQL server version</body></html>";
        }

        # Молчун на фазе ответа: политика этой фазы, а не фазы запроса.
        location /rsp-timeout/ {
            alias /usr/share/nginx/html/;

            waf_deadline response 300ms;
            waf_exception response timeout deny;
            waf_inspect  response mute wave=0 timeout=300ms;
        }

        # Пассивный инспектор не гейтит: его deny остаётся в аудите.
        location /passive/ {
            alias /usr/share/nginx/html/;
            waf_inspect request denier wave=0 timeout=1s mode=passive;
        }

        # Пассивный на ранней волне не виден поздней: записи в prior нет вовсе,
        # иначе он влиял бы на трафик чужими руками.
        location /passive-prior/ {
            alias /usr/share/nginx/html/;
            waf_inspect request denier wave=0 timeout=1s mode=passive;
            waf_inspect request scorer wave=1 timeout=1s;
            waf_score_deny request 90;
        }

        # Личности с ранней волны видны поздней: секция sessions сквозная, и
        # по ней ключуют корзины те, кто считает не по куке, а по человеку.
        location /sessions/ {
            alias /usr/share/nginx/html/;
            waf_inspect request gate   wave=0 timeout=1s;
            waf_inspect request scorer wave=1 timeout=1s;
            waf_score_deny request 90;
        }

        # Пассивная калитка личностей не называет: наблюдение не должно менять
        # то, по чему сосед считает, -- ровно как с prior.
        location /sessions-passive/ {
            alias /usr/share/nginx/html/;
            waf_inspect request gate   wave=0 timeout=1s mode=passive;
            waf_inspect request scorer wave=1 timeout=1s;
            waf_score_deny request 90;
        }

        # Совещательный голос: deny читается как 100 очков в живую сумму, сам
        # не решает. Порог выключен -- копим, не режем.
        location /vote/ {
            alias /usr/share/nginx/html/;
            waf_inspect request denier wave=0 timeout=1s mode=vote;
        }

        # Тот же голос при пороге в сотню: отказ по сумме, а не вердиктом
        # инспектора -- страница каталога по порогу.
        location /vote-over/ {
            alias /usr/share/nginx/html/;
            waf_score_deny request 100 response=suspicious;
            waf_inspect request denier wave=0 timeout=1s mode=vote;
        }

        # Score совещательного -- в живую сумму, не в тень, как у пассивного.
        location /vote-score/ {
            alias /usr/share/nginx/html/;
            waf_score_deny request 90;
            waf_inspect request scorer wave=0 timeout=1s mode=vote;
        }

        # Совещательный виден поздней волне: вердикт как сказан, score -- что
        # легло в сумму.
        location /vote-prior/ {
            alias /usr/share/nginx/html/;
            waf_inspect request denier wave=0 timeout=1s mode=vote;
            waf_inspect request scorer wave=1 timeout=1s;
        }

        # Очки просьбой: ложатся в сумму, порог выключен -- копим.
        location /points/ {
            alias /usr/share/nginx/html/;
            waf_inspect request pointer wave=0 timeout=1s;
        }

        # Очки плюс вердикт score поздней волны: сумма доходит до порога.
        location /points-over/ {
            alias /usr/share/nginx/html/;
            waf_score_deny request 100 response=suspicious;
            waf_inspect request pointer wave=0 timeout=1s;
            waf_inspect request scorer  wave=1 timeout=1s;
        }

        # Снять очки: поздняя волна уводит сумму под порог.
        location /points-cut/ {
            alias /usr/share/nginx/html/;
            waf_score_deny request 50 response=suspicious;
            waf_inspect request scorer wave=0 timeout=1s;
            waf_inspect request cutter wave=1 timeout=1s;
        }

        # Пассивный очков не снимает: просьба отброшена, сумма нетронута.
        location /points-passive/ {
            alias /usr/share/nginx/html/;
            waf_score_deny request 50 response=suspicious;
            waf_inspect request scorer wave=0 timeout=1s;
            waf_inspect request cutter wave=1 timeout=1s mode=passive;
        }

        # Действия доезжают до поздней волны: адресное и широковещательное.
        location /actions/ {
            alias /usr/share/nginx/html/;
            waf_inspect request asker  wave=0 timeout=1s;
            waf_inspect request scorer wave=1 timeout=1s;
            waf_score_deny request 90;
        }

        # Канал выключен на маршруте: действия с провода отброшены, вердикты
        # продолжают ездить как раньше.
        location /actions-off/ {
            alias /usr/share/nginx/html/;
            waf_actions_max 0;
            waf_inspect request asker  wave=0 timeout=1s;
            waf_inspect request scorer wave=1 timeout=1s;
            waf_score_deny request 90;
        }

        # Незнакомый адресат стоит действия, но не ответа: доставить его некому
        # ни на одном маршруте, а вердикт отправителя тут ни при чём.
        location /actions-unknown-to/ {
            alias /usr/share/nginx/html/;
            waf_inspect request asker_unknown wave=0 timeout=1s;
            waf_inspect request scorer        wave=1 timeout=1s;
            waf_score_deny request 90;
        }

        # Глаголы записи: запись есть вопреки waf_audit_sample 0, а заголовки
        # остаются агенту со сроком с провода -- без waf_archive. Разрешения
        # маршрут не спрашивает: просить вправе любой спрошенный инспектор.
        location /audit-on/ {
            alias /usr/share/nginx/html/;
            waf_audit_sample 0;
            waf_inspect request auditor wave=0 timeout=1s;
        }

        # Обе записи с фазы запроса: auditor просит про запрос и про ответ
        # (apply response), фаза ответа бежит молчаливым rsp_allow. Записи
        # обеих фаз есть при нулевом сэмпле, у каждой свой архив.
        location /audit-rsp/ {
            alias /usr/share/nginx/html/;
            waf_audit_sample 0;
            waf_capture  response headers=8k body=64k;
            waf_inspect  request  auditor   wave=0 timeout=1s;
            waf_deadline response 3s;
            waf_exception response timeout deny;
            waf_inspect  response rsp_allow wave=0 timeout=2s;
        }

        # Обе записи с фазы ответа: rsp_auditor просит и про ответ, и про
        # запрос -- запись запроса на маршруте с поздней фазой ждёт исхода и
        # слышит его. На фазе запроса только молчаливый req_quiet.
        location /audit-rsp-late/ {
            alias /usr/share/nginx/html/;
            waf_audit_sample 0;
            waf_capture  response headers=8k body=64k;
            waf_inspect  request  req_quiet   wave=0 timeout=1s;
            waf_deadline response 3s;
            waf_exception response timeout deny;
            waf_inspect  response rsp_auditor wave=0 timeout=2s;
        }

        # Незнакомый глагол отбраковывает ответ целиком: инспектор становится
        # молчуном, и исход выбирает политика дедлайна.
        location /actions-bad-verb/ {
            alias /usr/share/nginx/html/;
            waf_deadline request 300ms;
            waf_exception request timeout deny;
            waf_inspect  request asker_badverb wave=0 timeout=300ms;
        }

        # Ось не для этого глагола -- то же самое: пара "глагол + ось" и есть
        # смысл действия, и половины от неё не бывает.
        location /actions-bad-axis/ {
            alias /usr/share/nginx/html/;
            waf_deadline request 300ms;
            waf_exception request timeout deny;
            waf_inspect  request asker_badaxis wave=0 timeout=300ms;
        }

        # --- журнал без инспекторов ------------------------------------------
        #
        # Спрашивать некого, а записать маршрут велит. Запись фазы запроса
        # несёт превью заголовков, строки и тела; объекты, названные в
        # waf_archive, кладёт перекладка после прохода -- в размере архива и
        # со списками снимка: x-journal-secret -- sha256 и в превью, и в
        # обменнике.
        location /journal-req/ {
            waf_inspect  request none;
            waf_capture  request headers=8k args=8k;
            waf_capture  request headers mask=x-journal-secret;
            waf_preview  request headers=2k/256 args=1k body=1k;
            waf_archive  request headers args body ttl=1h;

            proxy_pass http://127.0.0.1:8080/ok/;
        }

        # Ответ без инспекторов фазы ответа: заголовки и тело уходят клиенту
        # сразу, копия префикса -- в обменник и в запись после отдачи.
        location /journal-rsp/ {
            waf_inspect  request none;
            waf_preview  response headers=1k/256 body=1k;
            waf_archive  response headers body ttl=1h;

            proxy_pass http://127.0.0.1:8080/canary/;
            proxy_http_version 1.1;
        }
    }
}
