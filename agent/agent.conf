# Node agent configuration: WAF_AGENT_CONFIG, /etc/waf/agent.conf by default.
#
# The environment overrides the file, so one file serves every node and WAF_NODE_ID tells them apart.
# S3 credentials never go here: they have their own secret file.

node {
    key          /run/secrets/waf_node_key
    data         /var/lib/waf/agent
    heartbeat    4s
    verdict_sock /var/run/waf/verdict.sock

    # nginx writes access_log and error_log lines here with its syslog writer; the agent ships them
    # to WAF_LOG. off turns the receiver off.
    log_sock /var/run/waf/log.sock
}

nats {
    url nats://nats:4222
}

# The same redis block as in inspector.conf. url is the exchange: request objects the module stores
# and the archive takes after the verdict. internal holds the generation blobs from the controller;
# without it they are read from the exchange. Environment: WAF_REDIS_URL, WAF_REDIS_INTERNAL_URL.
redis {
    url      redis://redis:6379
    internal redis://redis-internal:6379
}

# The controller can override the endpoint, region, buckets and the archive pace below; credentials
# are never overridden.
s3 {
    endpoint    http://minio:9000
    region      us-east-1
    credentials /run/secrets/waf_s3_creds

    # Three buckets: different sensitivity, different retention.
    bucket headers waf-headers
    bucket args    waf-args
    bucket body    waf-bodies
}

archive {
    workers 4
    queue   1024
    timeout 5s

    # S3 has no multi-object PUT, so a batch collects the objects of one kind and sends them at once.
    # off: send at once; size=N: when N objects wait; timeout=D: D after the first one; both: whichever
    # comes first. An audit record goes out when all its sections are uploaded.
    batch headers size=32 timeout=50ms
    batch args    size=32 timeout=50ms
    batch body    size=8  timeout=100ms
}

nginx {
    bin       nginx
    conf_dir  /etc/nginx
    store_dir /var/lib/waf/store
}
